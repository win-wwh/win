  ["夜勤もできます。","やきんも できます。","ညဆိုင်းလည်း လုပ်နိုင်ပါတယ်။"],
  ["介護福祉士の資格を取りたいです。","かいごふくしし の しかくを とりたいです。","Kaigo Fukushishi လက်မှတ် ယူချင်ပါတယ်။"]]],
 ["質問する","မေးခွန်း မေး",[
  ["夜勤は月に何回ありますか。","やきんは つきに なんかい ありますか。","ညဆိုင်း တစ်လ ဘယ်နှစ်ကြိမ်လဲ။"],
  ["資格を取るサポートはありますか。","しかくを とる サポートは ありますか。","လက်မှတ်ယူဖို့ ကူညီမှု ရှိလား။"],
  ["給料の手取りはだいたいいくらですか。","きゅうりょうの てどりは だいたい いくらですか。","လက်ထဲရ လစာ ဘယ်လောက်လဲ။"],
  ["外国人のスタッフはいますか。","がいこくじんの スタッフは いますか。","နိုင်ငံခြားသား ဝန်ထမ်း ရှိလား။"]]]

const RESUME=[
 {jp:"履歴書（りれきしょ）の書き方",mm:"ကိုယ်ရေးရာဇဝင် ရေးနည်း",
  b:["名前・住所・電話・学歴・職歴・資格・在留資格を書きます。","写真（たて4cm×よこ3cm）を貼ります。","日本語能力（N3など）、介護の資格（初任者研修、特定技能の試験合格）も書きましょう。","パソコンやスマホで作ってもOKな所が多いです。"],
  m:"နာမည်၊ လိပ်စာ၊ ဖုန်း၊ ပညာရေး၊ အလုပ်အတွေ့အကြုံ၊ လက်မှတ်၊ ဗီဇာ ရေးပါ။ ဓာတ်ပုံ (၄×၃ စင်တီ) ကပ်ပါ။ ဂျပန်စာ အဆင့် (N3 စသည်)၊ သူနာပြု လက်မှတ် ရေးပါ။"},
 {jp:"面接のマナー",mm:"အင်တာဗျူး အမူအကျင့်",
  b:["5〜10分前に着く。おくれるときは必ず電話。","清潔な服、髪をまとめる、爪を短く。","入るとき「失礼します」、終わったら「ありがとうございました」。","在留カード・履歴書・資格の証明書を持って行く。"],
  m:"၅–၁၀ မိနစ် ကြိုရောက်ပါ။ နောက်ကျရင် ဖုန်းဆက်ပါ။ သန့်ရှင်းတဲ့ အဝတ်၊ ဆံပင် စည်း၊ လက်သည်း တို။ ဝင်ရင် “Shitsurei shimasu”၊ ပြီးရင် “Arigatou gozaimashita”။ ကတ်၊ ရာဇဝင်၊ လက်မှတ် ယူသွားပါ။"}

const $=s=>document.querySelector(s),main=$("#main"),back=$("#back");
let lang=localStorage.getItem("jobs-lang")||"both";
function setLang(l){lang=l;localStorage.setItem("jobs-lang",l);document.body.classList.toggle("hide-jp",l==="mm");document.body.classList.toggle("hide-mm",l==="jp");document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l))}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
function item(it,open){
 const tels=(it.t||[]).map(t=>`<a class="tel" href="tel:${t[0].replace(/-/g,"")}">📞 <div><b>${t[0]}</b><span>${t[1]}${t[2]?"・"+t[2]:""}</span></div></a>`).join("");
 const links=it.l?`<div class="links">${it.l.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">🔗 ${x[0]}</a>`).join("")}</div>`:"";
 return `<div class="item${open?" open":""}"><button><span class="jp">${it.jp}</span><span class="m mm mmonly">${it.mm}</span></button><div class="body"><ul class="jp">${it.b.map(x=>`<li>${x}</li>`).join("")}</ul><div class="mmb mm mmonly">${it.m}</div>${tels}${links}</div></div>`}
function bind(){main.querySelectorAll(".item>button").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"))}
function title(e,jp,mm){return `<h2 style="margin:4px 0 12px;font-size:19px">${e} <span class="jp">${jp}</span> <span class="mm mmonly" style="font-size:14px;font-weight:600">${mm}</span></h2>`}
const PAGES={
 where:()=>title("🔎","どこでさがす？","ဘယ်မှာ ရှာမလဲ")+WHERE.map((x,i)=>item(x,i===0)).join(""),
 visa:()=>title("🪪","ビザと仕事","ဗီဇာ နဲ့ အလုပ်")+VISA.map((x,i)=>item(x,i===0)).join(""),
 kind:()=>title("🏠","介護の職場の種類","သူနာပြု လုပ်ငန်းခွင် အမျိုးအစား")+KIND.map(k=>`<div class="item open"><button><span class="jp">${k[0]}</span><span class="m mm mmonly">${k[1]}</span></button><div class="body"><div class="jp">${k[2]}</div><div class="mm mmonly" style="font-size:14px;color:#6a5a4a">${k[3]}</div></div></div>`).join(""),
 check:()=>{const sv=JSON.parse(localStorage.getItem("jobs-check")||"[]");
  return title("✅","求人票チェック","အလုပ်ခေါ်စာ စစ်ဆေး")+`<div class="score" id="sc"></div>`+CHECK.map((c,i)=>`<label class="chk${c[2]?" bad":""}"><input type="checkbox" data-i="${i}" ${sv[i]?"checked":""}><span><span class="jp">${c[0]}</span><span class="m mm mmonly">${c[1]}</span></span></label>`).join("")+`<p class="jp" style="font-size:13px;color:#7a6a5b">赤い線の2つがチェックできないときは、とくに注意してください。</p><p class="mm mmonly" style="font-size:13px;color:#7a6a5b">အနီရောင် ၂ ခု မမှန်ရင် အထူး သတိထားပါ။</p><button class="btn" id="rst" style="background:#b9a58f">リセット / ပြန်စ</button>`},
 phrase:()=>title("🗣️","面接・電話の日本語","အင်တာဗျူး / ဖုန်း ဂျပန်စကား")+`<p style="font-size:13px;color:#7a6a5b;margin-top:-6px">🔊 で音が出ます / 🔊 နှိပ်ရင် အသံထွက်</p>`+PH.map(g=>`<h3>${g[0]} <span class="mm mmonly" style="font-weight:400">${g[1]}</span></h3>`+g[2].map(p=>`<div class="ph"><div><div class="jpL">${p[0]}</div><div class="k">${p[1]}</div><div class="mm mmonly" style="font-size:14px">${p[2]}</div></div><button data-s="${p[0]}">🔊</button></div>`).join("")).join(""),
 resume:()=>title("📝","履歴書・面接のコツ","ရာဇဝင် / အင်တာဗျူး")+RESUME.map((x,i)=>item(x,i===0)).join(""),
 memo:()=>title("📒","わたしの求人メモ","ကျွန်ုပ်၏ အလုပ် မှတ်စု")+`<form class="memo" id="f"><input name="n" placeholder="会社・施設の名前 / နာမည်" required><div class="row2"><input name="w" type="number" inputmode="numeric" placeholder="時給（円）/ နာရီ"><select name="s"><option>気になる</option><option>応募した</option><option>面接</option><option>合格</option><option>だめ</option></select></div><textarea name="t" rows="2" placeholder="メモ：場所・夜勤・寮など / မှတ်စု"></textarea><button class="btn">＋ 保存 / သိမ်း</button></form><div id="list"></div>`
};
const MENU=[["where","🔎","どこでさがす？","ဘယ်မှာ ရှာမလဲ"],["visa","🪪","ビザと仕事","ဗီဇာ နဲ့ အလုပ်"],["check","✅","求人票チェック","ခေါ်စာ စစ်ဆေး"],["kind","🏠","介護の職場","လုပ်ငန်းခွင် အမျိုးအစား"],["resume","📝","履歴書・面接","ရာဇဝင် / အင်တာဗျူး"],["phrase","🗣️","面接の日本語","အင်တာဗျူး စကား"]];
function home(){document.body.classList.remove("sub");back.style.display="none";
 main.innerHTML=`<div class="grid"><button class="cat big" data-p="memo"><span class="e">📒</span>わたしの求人メモ<span class="m mm">ကျွန်ုပ်၏ အလုပ် မှတ်စု</span></button>${MENU.map(m=>`<button class="cat" data-p="${m[0]}"><span class="e">${m[1]}</span><span class="jp">${m[2]}</span><span class="m mm">${m[3]}</span></button>`).join("")}</div>
 <div class="links" style="margin-top:14px"><a href="../work/">🌏 日本で働く ガイド（ビザ・給料・相談先）</a></div>`;
 main.querySelectorAll(".cat").forEach(b=>b.onclick=()=>go(b.dataset.p));window.scrollTo(0,0)}
function go(p){document.body.classList.add("sub");back.style.display="block";main.innerHTML=PAGES[p]();bind();history.pushState({p},"");window.scrollTo(0,0);
 if(p==="check"){const upd=()=>{const v=[...main.querySelectorAll(".chk input")].map(x=>x.checked);localStorage.setItem("jobs-check",JSON.stringify(v));const n=v.filter(Boolean).length;$("#sc").innerHTML=`${n} / ${v.length} OK<div class="bar"><i style="width:${n/v.length*100}%"></i></div>`};main.querySelectorAll(".chk input").forEach(x=>x.onchange=upd);upd();$("#rst").onclick=()=>{main.querySelectorAll(".chk input").forEach(x=>x.checked=false);upd()}}
 if(p==="phrase")main.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.s);u.lang="ja-JP";u.rate=.85;speechSynthesis.speak(u)}catch(e){}});
 if(p==="memo")memo()}
function memo(){const load=()=>JSON.parse(localStorage.getItem("jobs-memo")||"[]"),save=a=>localStorage.setItem("jobs-memo",JSON.stringify(a));
 const draw=()=>{const a=load();$("#list").innerHTML=a.length?a.map((j,i)=>`<div class="job"><span class="w${j.w&&j.w<MINW?" low":""}">${j.w?j.w.toLocaleString()+"円":""}</span><b>${j.n.replace(/</g,"&lt;")}</b><br><span class="st">${j.s}</span>${j.w&&j.w<MINW?`<span class="st" style="background:#fbe0dc;color:#c0392b">⚠️ 全国平均の最低賃金より低い→県の金額を確認</span>`:""}<div style="font-size:14px;color:#6a5a4a;white-space:pre-wrap">${(j.t||"").replace(/</g,"&lt;")}</div><button class="del" data-i="${i}">削除</button><div style="clear:both"></div></div>`).join(""):`<p style="color:#8a7a6a;text-align:center">まだありません / မရှိသေးပါ</p>`;
  $("#list").querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(confirm("削除しますか？")){const a=load();a.splice(+b.dataset.i,1);save(a);draw()}})};
 $("#f").onsubmit=e=>{e.preventDefault();const f=e.target,a=load();a.unshift({n:f.n.value.trim(),w:+f.w.value||0,s:f.s.value,t:f.t.value.trim()});save(a);f.reset();draw()};draw()}
back.onclick=()=>history.back();window.onpopstate=()=>home();
setLang(lang);home();
</script>
