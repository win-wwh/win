<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>実務者研修 まなびノート</title>
<meta name="description" content="介護福祉士実務者研修の20科目・450時間の中身を、やさしい日本語とミャンマー語で説明。クイズつき。">
<meta property="og:title" content="実務者研修 まなびノート"><meta property="og:description" content="実務者研修20科目の中身をやさしく解説・クイズつき">
<meta property="og:url" content="https://winlabjp.com/jitsumu/"><meta property="og:image" content="https://winlabjp.com/jitsumu/icon-512.png">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3b5bdb">
<style>
:root{--ink:#1f2a44;--sub:#64708a;--bg:#f3f5fb;--card:#fff;--A:#e8590c;--B:#2f9e44;--C:#7048e8;--D:#d6336c;--main:#3b5bdb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.top h1{font-size:21px;margin:0;flex:1;line-height:1.25}.top h1 small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.ib{border:0;background:#fff;border-radius:14px;width:44px;height:44px;font-size:20px;box-shadow:0 2px 6px #0000000d}
.hero{background:linear-gradient(135deg,#3b5bdb,#5c7cfa);color:#fff;border-radius:22px;padding:18px;display:flex;gap:16px;align-items:center;box-shadow:0 8px 20px #3b5bdb33}
.ring{width:92px;height:92px;flex:none;position:relative}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:24px}.ring b small{font-size:11px;font-weight:600;opacity:.9}
.hero p{margin:4px 0 0;font-size:13px;opacity:.95;line-height:1.6}
.bar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:14px 0 6px}.bar i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub)}.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--c)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.btn{border:0;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:800;background:#fff;color:var(--ink);box-shadow:0 2px 6px #0000000f}
.btn.pri{background:var(--main);color:#fff;box-shadow:0 4px 0 #2b45b0}
h2{font-size:16px;margin:20px 4px 8px;display:flex;align-items:center;gap:8px}h2 .mm{font-weight:500}
.sj{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 6px #0000000a;border-left:6px solid var(--c);cursor:pointer}
.sj .no{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.sj .tx{flex:1;min-width:0}.sj .tx b{font-size:15px;display:block}.sj .tx span{font-size:12px;color:var(--sub)}
.sj .hr{font-size:12px;font-weight:800;color:var(--c);text-align:right;flex:none}.sj .ok{font-size:20px}
.mm{color:#7a6a8a;font-size:12px;font-family:"Noto Sans Myanmar","Myanmar Sangam MN",sans-serif}
.hide-mm .mm{display:none}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0000000d}
.card h3{margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:center}
.shead{border-radius:22px;padding:18px;color:#fff;background:var(--c)}.shead .k{font-size:12px;font-weight:800;opacity:.9}.shead h2{color:#fff;margin:4px 0 6px;font-size:22px}.shead .mm{color:#fff;opacity:.85}
.one{font-size:16px;font-weight:700;line-height:1.7;margin:10px 0 0}
.pt{display:flex;gap:10px;padding:10px 0;border-top:1px dashed #e3e6ef;font-size:15px;line-height:1.75}.pt:first-of-type{border-top:0}
.pt .d{width:24px;height:24px;border-radius:50%;background:#eef1fb;color:var(--main);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;margin-top:3px}
.say{border:0;background:#eef1fb;border-radius:50%;width:36px;height:36px;font-size:16px;flex:none}
.ex{background:#fff8e6;border:2px solid #ffd43b;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.75}
.wd{display:grid;grid-template-columns:1fr 1fr;gap:8px}.w{background:#f5f7fd;border-radius:14px;padding:10px;text-align:center}
.w ruby{font-size:18px;font-weight:900}.w rt{font-size:10px;color:var(--main)}.w .mm{display:block;margin-top:2px}
.q{margin:10px 0 16px}.q p{font-weight:800;margin:0 0 8px;font-size:15px}
.ch{display:block;width:100%;text-align:left;border:2px solid #e3e6ef;background:#fff;border-radius:14px;padding:12px;margin:6px 0;font-size:15px;color:var(--ink)}
.ch.ok{border-color:#2f9e44;background:#ebfbee}.ch.ng{border-color:#e03131;background:#fff5f5}
.ex2{font-size:13px;color:var(--sub);background:#f5f7fd;border-radius:10px;padding:8px 10px;margin-top:4px}
.done{background:#2f9e44;color:#fff;box-shadow:0 4px 0 #237032}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info li{margin:6px 0;line-height:1.7;font-size:15px}
.qz .big{font-size:18px;font-weight:900;line-height:1.6;margin:6px 0 12px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
.src{font-size:12px;color:var(--sub);line-height:1.7}.src a{color:var(--main)}
</style></head><body>
<div class="wrap" id="app"></div><div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);const GC={A:"var(--A)",B:"var(--B)",C:"var(--C)",D:"var(--D)"};
let ST;try{ST=JSON.parse(localStorage.getItem("jitsumu-v1"))||{}}catch(e){ST={}}ST.done=ST.done||{};ST.mm=ST.mm!==false;
const save=()=>{try{localStorage.setItem("jitsumu-v1",JSON.stringify(ST))}catch(e){}};
document.body.classList.toggle("hide-mm",!ST.mm);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[（）()]/g,"、"));u.lang="ja-JP";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
const hdr=(back)=>`<div class="top">${back?`<button class="ib" onclick="home()">‹</button>`:`<span style="font-size:30px">📘</span>`}<h1>実務者研修 まなびノート<small>介護福祉士実務者研修の 中身 <span class="mm">လက်တွေ့လုပ်ငန်း သင်တန်း</span></small></h1><button class="ib" onclick="tgl()">${ST.mm?"🇲🇲":"🇯🇵"}</button></div>`;
function tgl(){ST.mm=!ST.mm;save();document.body.classList.toggle("hide-mm",!ST.mm);toast(ST.mm?"ミャンマー語 ON":"ミャンマー語 OFF");render()}
let view=()=>home();function render(){view()}
function home(){view=home;scrollTo(0,0);const n=Object.keys(ST.done).length,hd=JS.filter(s=>ST.done[s.n]).reduce((a,s)=>a+s.h,0);
 const R=40,C=2*Math.PI*R;
 $("#app").innerHTML=hdr()+`<div class="hero"><div class="ring"><svg viewBox="0 0 100 100" width="92" height="92"><circle cx="50" cy="50" r="${R}" fill="none" stroke="#ffffff44" stroke-width="10"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/20)}" transform="rotate(-90 50 50)"/></svg><b>${n}<small>/ 20科目</small></b></div>
 <div><b style="font-size:17px">全部で 20科目・450時間</b><p>学んだ時間 ${hd} / 450時間<br>初任者研修を 持っている 人は 320時間（いくつか 免除）。</p></div></div>
 <div class="bar">${JG.map(g=>`<i style="background:${GC[g[0]]};width:${JS.filter(s=>s.g===g[0]).reduce((a,s)=>a+s.h,0)/4.5}%"></i>`).join("")}</div>
 <div class="leg">${JG.map(g=>`<span style="--c:${GC[g[0]]}">${g[1]} ${JS.filter(s=>s.g===g[0]).reduce((a,s)=>a+s.h,0)}時間</span>`).join("")}</div>
 <div class="btns"><button class="btn pri" onclick="quiz()">🎯 まとめクイズ</button><button class="btn" onclick="info()">ℹ️ 実務者研修とは</button></div>
 ${JG.map(g=>`<h2>${g[1]} <span class="mm">${g[2]}</span></h2>`+JS.filter(s=>s.g===g[0]).map(s=>`<div class="sj" style="--c:${GC[s.g]}" onclick="subj(${s.n})"><div class="no">${s.n}</div><div class="tx"><b>${s.t}</b><span>${s.one.slice(0,26)}…</span><div class="mm">${s.mm}</div></div><div class="hr">${s.h}時間</div><div class="ok">${ST.done[s.n]?"✅":"›"}</div></div>`).join("")).join("")}
 <div class="card src">📌 科目と時間数は 国（厚生労働省）の 基準です。説明と クイズは、わかりやすく するために 作った オリジナルです。学校の テキストも いっしょに 使ってください。<br><a href="https://www.mhlw.go.jp/content/11800000/000701052.pdf" target="_blank">厚生労働省の資料（PDF）</a></div>`}
function subj(n){view=()=>subj(n);scrollTo(0,0);const s=JS.find(x=>x.n===n),g=JG.find(x=>x[0]===s.g);
 $("#app").innerHTML=hdr(1)+`<div class="shead" style="--c:${GC[s.g]}"><div class="k">${g[1]} ・ 科目 ${s.n} / 20 ・ ${s.h}時間</div><h2>${s.t}</h2><div class="mm">${s.mm}</div><div class="one">${s.one}</div><div class="mm">${s.onemm}</div></div>
 <div class="card"><h3>📖 学ぶこと <button class="say" style="margin-left:auto" onclick='say(${JSON.stringify(s.pts.join("。"))})'>🔊</button></h3>${s.pts.map((p,i)=>`<div class="pt"><span class="d">${i+1}</span><span style="flex:1">${p}</span><button class="say" onclick='say(${JSON.stringify(p)})'>🔊</button></div>`).join("")}</div>
 <div class="card"><h3>🏥 現場では</h3><div class="ex">${s.ex}</div></div>
 <div class="card"><h3>🔤 大事な ことば</h3><div class="wd">${s.w.map(w=>`<div class="w" onclick='say(${JSON.stringify(w[1])})'><ruby>${w[0]}<rt>${w[1]}</rt></ruby><span class="mm">${w[2]}</span></div>`).join("")}</div></div>
 <div class="card"><h3>✏️ 確認クイズ</h3>${s.q.map((q,i)=>`<div class="q" id="q${i}"><p>Q${i+1}. ${q[0]}</p>${q[1].map((c,j)=>`<button class="ch" onclick="ans(${n},${i},${j})">${"ABC"[j]}. ${c}</button>`).join("")}</div>`).join("")}</div>
 <button class="btn ${ST.done[n]?"":"done"}" style="width:100%;margin:6px 0 12px" onclick="mark(${n})">${ST.done[n]?"✅ 学んだ（もう一度 押すと 取り消し）":"✅ この科目を 学んだ！"}</button>
 <div class="nav"><button class="btn" ${n<2?"disabled style='opacity:.4'":""} onclick="subj(${n-1})">‹ 前の科目</button><button class="btn" ${n>19?"disabled style='opacity:.4'":""} onclick="subj(${n+1})">次の科目 ›</button></div>`}
function ans(n,i,j){const q=JS.find(x=>x.n===n).q[i],box=$("#q"+i);if(box.dataset.a)return;box.dataset.a=1;
 box.querySelectorAll(".ch").forEach((b,k)=>{if(k===q[2])b.classList.add("ok");else if(k===j)b.classList.add("ng")});
 box.insertAdjacentHTML("beforeend",`<div class="ex2">${j===q[2]?"⭕ 正解！":"❌ ざんねん。"} ${q[3]}</div>`);say(j===q[2]?"せいかい":"ざんねん")}
function mark(n){if(ST.done[n])delete ST.done[n];else{ST.done[n]=1;toast("🎉 よくできました！")}save();render()}
function info(){view=info;scrollTo(0,0);$("#app").innerHTML=hdr(1)+`<div class="card info"><h3>ℹ️ 実務者研修とは</h3><ul>
 <li>介護福祉士の 国家試験を 受けるために 必要な 研修です。<span class="mm">အမျိုးသားစာမေးပွဲ ဖြေရန် လိုအပ်သော သင်တန်း</span></li>
 <li>実務経験 3年（1095日 以上・働いた日 540日 以上）＋ 実務者研修の 修了で、受験できます。</li>
 <li>全部で <b>20科目・450時間</b>。初任者研修などを 持っている 人は、いくつかの 科目が 免除に なります（初任者研修なら 320時間）。</li>
 <li>多くは 家で 勉強（テキスト・レポート）＋ 教室に 通う日（介護過程Ⅲ と 医療的ケアの 演習）。</li>
 <li>修了証に 期限は ありません。</li>
 <li>修了すると「サービス提供責任者」にも なれます。</li></ul></div>
 <div class="card info"><h3>⚖️ 初任者研修と 実務者研修の ちがい</h3>
 <table style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.5">
 <tr style="background:#eef1fb"><th style="padding:8px;text-align:left"></th><th style="padding:8px">初任者研修</th><th style="padding:8px">実務者研修</th></tr>
 <tr><td style="padding:8px;font-weight:800">レベル</td><td>入門（はじめの一歩）</td><td>応用（もっと深く）</td></tr>
 <tr style="background:#f8f9fd"><td style="padding:8px;font-weight:800">時間</td><td>130時間</td><td>450時間<br><small>初任者を持っていれば 320時間</small></td></tr>
 <tr><td style="padding:8px;font-weight:800">期間の めやす</td><td>1〜4か月</td><td>4〜6か月</td></tr>
 <tr style="background:#f8f9fd"><td style="padding:8px;font-weight:800">医療的ケア</td><td>なし</td><td>あり（たん吸引・経管栄養の 基本）</td></tr>
 <tr><td style="padding:8px;font-weight:800">介護過程</td><td>少し</td><td>くわしく（Ⅰ・Ⅱ・Ⅲ）</td></tr>
 <tr style="background:#f8f9fd"><td style="padding:8px;font-weight:800">最後の 試験</td><td>筆記テスト</td><td>実技などの 修了評価</td></tr>
 <tr><td style="padding:8px;font-weight:800">できること</td><td>訪問介護で 体の 介護が できる</td><td>国家試験の 受験に 必要／サービス提供責任者に なれる</td></tr>
 </table><p class="mm" style="margin-top:8px">ကနဦးသင်တန်း = အခြေခံ ၁၃၀ နာရီ ・ လက်တွေ့လုပ်ငန်းသင်တန်း = အဆင့်မြင့် ၄၅၀ နာရီ (အမျိုးသားစာမေးပွဲအတွက် လိုအပ်)</p></div>
 <div class="card info"><h3>🗺 これからの 道</h3><ul><li>① 実務者研修（今ここ）</li><li>② 実務3年 ＋ 修了 → 介護福祉士 国家試験（毎年 1月ごろ・申しこみは 夏）</li><li>③ 介護福祉士として 5年・900日 → ケアマネジャーの 試験</li></ul></div>
 <div class="card src">申しこみ・日程・費用は 学校や 職場で 必ず 確認してください。</div>`}
let QZ;function quiz(){const all=[];JS.forEach(s=>s.q.forEach(q=>all.push({s,q})));QZ={list:all.sort(()=>Math.random()-.5).slice(0,10),i:0,ok:0};qs()}
function qs(){view=qs;scrollTo(0,0);const {s,q}=QZ.list[QZ.i];$("#app").innerHTML=hdr(1)+`<div class="card qz"><div style="display:flex;justify-content:space-between;font-weight:800;color:var(--sub)"><span>🎯 ${QZ.i+1} / 10</span><span>⭕ ${QZ.ok}</span></div>
 <div style="font-size:12px;font-weight:800;color:${GC[s.g]};margin-top:8px">科目${s.n}：${s.t}</div><div class="big">${q[0]}</div><div id="qq">${q[1].map((c,j)=>`<button class="ch" onclick="qa(${j})">${"ABC"[j]}. ${c}</button>`).join("")}</div><div id="qx"></div></div>`;say(q[0])}
function qa(j){const {s,q}=QZ.list[QZ.i];const box=$("#qq");if(box.dataset.a)return;box.dataset.a=1;box.querySelectorAll(".ch").forEach((b,k)=>{if(k===q[2])b.classList.add("ok");else if(k===j)b.classList.add("ng")});
 const ok=j===q[2];if(ok)QZ.ok++;say(ok?"せいかい":"ざんねん");
 $("#qx").innerHTML=`<div class="ex2">${ok?"⭕ 正解！":"❌ ざんねん。"} ${q[3]}</div><button class="btn pri" style="width:100%;margin-top:12px" onclick="qn()">${QZ.i<9?"次へ ›":"結果を 見る"}</button><button class="btn" style="width:100%;margin-top:8px" onclick="subj(${s.n})">📖 この科目を 読む</button>`}
function qn(){QZ.i++;if(QZ.i<10)qs();else{view=home;$("#app").innerHTML=hdr(1)+`<div class="card" style="text-align:center"><div style="font-size:64px">${QZ.ok>=8?"🏆":QZ.ok>=5?"🌟":"💪"}</div><h2 style="justify-content:center;font-size:24px">${QZ.ok} / 10 正解</h2><p>${QZ.ok>=8?"すばらしい！":QZ.ok>=5?"いいね！もう少し！":"科目を 読んで もう一回！"}</p><button class="btn pri" style="width:100%" onclick="quiz()">もう一回</button><button class="btn" style="width:100%;margin-top:8px" onclick="home()">🏠 もどる</button></div>`;say(QZ.ok+"もん せいかい")}}
home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});
</script></body></html>
