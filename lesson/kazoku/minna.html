<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなで あそぶ：親族・家族・世帯</title><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#fff4e6,#ffe8cc);min-height:100vh;color:#2b2118;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.mm{font-family:"Noto Sans Myanmar","Myanmar Sangam MN",sans-serif;color:#6741d9}
.wrap{max-width:620px;margin:auto;padding:12px 14px 40px}
a.back,button.back{background:none;border:0;padding:0;color:#d9480f;font-weight:800;font-size:15px;text-decoration:none;font-family:inherit}
h1{font-size:24px;margin:6px 0 2px}.sub{color:#7a6550;font-size:13px;line-height:1.6;margin-bottom:10px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 0 #f0c9a0;margin-bottom:12px}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:900;background:#fd7e14;color:#fff;width:100%;margin-top:10px;box-shadow:0 4px 0 #d9480f;font-family:inherit}
.btn.g{background:#fff;color:#d9480f;box-shadow:0 4px 0 #f0c9a0}.btn.b{background:#1c7ed6;box-shadow:0 4px 0 #1864ab}.btn:disabled{opacity:.4}
input{width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid #f0c9a0;font-family:inherit}
.link{font-size:13px;word-break:break-all;background:#fff8f0;border-radius:10px;padding:8px 10px;margin-top:8px}
.hud{display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin:6px 0 8px}
.qtx{font-size:21px;font-weight:900;text-align:center;line-height:1.6;min-height:90px;display:flex;align-items:center;justify-content:center}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chs button{border:0;border-radius:16px;font-size:24px;font-weight:900;padding:16px 0;color:#fff;font-family:inherit}
.c0{background:#e8590c;box-shadow:0 4px 0 #b8430a}.c1{background:#1c7ed6;box-shadow:0 4px 0 #1864ab}.c2{background:#2b8a3e;box-shadow:0 4px 0 #1f6b2f}.c3{background:#ae3ec9;box-shadow:0 4px 0 #862e9c}
.chs button.me{outline:5px solid #ffd43b}
.ppl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ppl span{background:#fff3bf;border-radius:20px;padding:5px 10px;font-weight:800;font-size:14px}.ppl span.ok{background:#d3f9d8}.ppl span.wait{background:#f1f3f5;color:#868e96}
.ans{border-radius:14px;padding:10px 12px;margin-top:8px;border:3px solid transparent;background:#f8f9fa}.ans.right{border-color:#2b8a3e;background:#ebfbee}
.ans .h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px}.ans .h .dot{width:16px;height:16px;border-radius:50%}.ans .h .n{margin-left:auto;color:#7a6550}
.rk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f3e3d0;font-size:17px}.rk b{flex:1}.rk .md{font-size:26px;width:36px;text-align:center}.rk .sc{font-weight:900;color:#d9480f}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}.tbl th,.tbl td{border-bottom:1px solid #f3e3d0;padding:6px 4px;text-align:center}.tbl td:first-child,.tbl th:first-child{text-align:left}
.st{font-size:12px;color:#7a6550;text-align:center;margin-top:6px}.st.err{color:#e03131;font-weight:800}
.spin{display:inline-block;animation:sp 1.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap" id="app"></div>
<script src="game-data.js"></script>
<script>
/* しくみ：ntfy.sh（無料の 公開メッセージ サーバー）で、同じ ルームの 人どうし 答えを やりとり します */
const app=document.getElementById("app"),$=i=>document.getElementById(i);
const SP=new URLSearchParams(location.search),BASE=SP.get("srv")||"https://ntfy.sh";
const NQ=10,COL=["#e8590c","#1c7ed6","#2b8a3e","#ae3ec9"];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=7;for(const c of s)h=Math.imul(h,31)+c.charCodeAt(0)|0;return h}
function shS(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQ(room){const r=rng(hash(room));const ox=shS(OX,r).slice(0,6).map(o=>({t:o[0],c:["○","✕"],a:o[1]?0:1,e:o[2]}));
 const sn=shS(N.filter(n=>n[0]!=="honnin"),r).slice(0,4).map(n=>{const opts=n[4]==="なし"?["1","2","3","なし"]:["1","2","3","4"];if(n[4]!=="なし"&&!opts.includes(String(n[4])))opts[3]=String(n[4]);return{t:`本人から 見て「${n[1]}」は 何親等？`,c:opts.map(o=>o==="なし"?"なし":o+"親等"),a:opts.indexOf(String(n[4])),e:n[5]}});
 return shS([...ox,...sn],r)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");

let ROOM=null,TOPIC=null,ME=null,HOST=false,Q=[],SEEN=new Set(),ES=null,POLL=null,CONN=0;
const S={players:{},ans:{},started:false,reveal:{}};// ans[q][id]=choice
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}

/* --- 通信 --- */
async function pub(o){o.id=ME.id;o.n=ME.n;for(let i=0;i<3;i++){try{const r=await fetch(BASE+"/"+TOPIC,{method:"POST",body:JSON.stringify(o)});if(r.ok)return true}catch(e){}await new Promise(r=>setTimeout(r,800))}stat("⚠️ 送れませんでした。インターネットを 確認して ください",1);return false}
function onMsg(m){if(!m||m.event!=="message"||SEEN.has(m.id))return;SEEN.add(m.id);let o;try{o=JSON.parse(m.message)}catch(e){return}apply(o);render()}
function listen(){try{ES=new EventSource(BASE+"/"+TOPIC+"/sse?since=all");ES.onmessage=e=>{CONN=1;stat("");try{onMsg(JSON.parse(e.data))}catch(x){}};ES.onopen=()=>{CONN=1;stat("")};ES.onerror=()=>{CONN=0;stat("つながり なおし中…")}}catch(e){}
 POLL=setInterval(poll,6000);poll()}
async function poll(){try{const r=await fetch(BASE+"/"+TOPIC+"/json?poll=1&since=all");const t=await r.text();let ch=0;t.split("\n").forEach(l=>{if(!l.trim())return;try{const m=JSON.parse(l);if(!SEEN.has(m.id)){SEEN.add(m.id);const o=JSON.parse(m.message);apply(o);ch=1}}catch(e){}});if(ch)render();CONN=1;stat("")}catch(e){if(!CONN)stat("⚠️ サーバーに つながりません",1)}}
function stat(t,err){const e=$("st");if(e){e.textContent=t;e.className="st"+(err?" err":"")}}
function apply(o){if(!o||!o.id)return;
 if(o.t==="join"){S.players[o.id]=S.players[o.id]||{n:o.n,host:!!o.host};S.players[o.id].n=o.n;if(o.host)S.players[o.id].host=true}
 if(o.t==="start")S.started=true;
 if(o.t==="ans"&&typeof o.q==="number"){(S.ans[o.q]=S.ans[o.q]||{})[o.id]=o.c;S.players[o.id]=S.players[o.id]||{n:o.n}}
 if(o.t==="reveal")S.reveal[o.q]=1}
const P=()=>Object.entries(S.players).filter(([id,p])=>!p.host||p.play);
const players=()=>Object.keys(S.players);
function allIn(q){const a=S.ans[q]||{};return players().length>0&&players().every(id=>id in a)}
function revealed(q){return S.reveal[q]||allIn(q)}
function score(id){return Q.reduce((s,q,k)=>s+((S.ans[k]||{})[id]===q.a&&revealed(k)?1:0),0)}

/* --- 画面 --- */
let VIEW="home";
function home(){VIEW="home";app.innerHTML=`<a class="back" href="game.html">‹ ゲーム</a><h1>👥 みんなで あそぶ</h1><div class="sub">Zoom でも OK！ リンクを チャットに 送って、みんなで 同じ 問題に 答えます。<br>全員が 答えると、みんなの 答えが 見られます。<br><span class="mm">Zoom chat ထဲ link ပို့ပြီး အားလုံး အတူ ဖြေကြမယ်</span></div>
 <div class="card"><b>👩‍🏫 先生（ルームを 作る）</b><input id="hn" placeholder="先生の 名前（例：ウィン先生）" value="${esc((load("mn-name")||""))}" style="margin-top:8px"><button class="btn" onclick="create()">🏠 ルームを 作る</button></div>
 <div class="sub" style="text-align:center">🎒 生徒は 先生から 送られた リンクを 開いて ください</div>`}
function create(){const n=$("hn").value.trim();if(!n){alert("名前を 入れて ください");return}store("mn-name",n);ROOM=rid(10);history.replaceState(null,"",location.pathname+"?r="+ROOM+(SP.get("srv")?"&srv="+SP.get("srv"):""));store("mn-host-"+ROOM,1);enter(n,true)}
function joinView(){VIEW="join";app.innerHTML=`<h1>👥 みんなで あそぶ</h1><div class="sub">親族・家族・世帯 ／ 10問</div><div class="card"><b>名前を 入れて ください</b> <span class="mm" style="font-size:13px">နာမည် ထည့်ပါ</span><input id="pn" style="margin-top:8px" placeholder="例：Aung" value="${esc(load("mn-name")||"")}"><button class="btn" onclick="const n=$('pn').value.trim();if(!n){alert('名前を 入れて ください');return}store('mn-name',n);enter(n,false)">▶ 入る</button></div>`}
function enter(n,host){HOST=host;TOPIC="winlabjp-kazoku-"+ROOM;Q=makeQ(ROOM);
 let me=load("mn-me-"+ROOM);if(!me){me={id:rid(8),k:0};store("mn-me-"+ROOM,me)}ME={id:me.id,n};
 VIEW="lobby";listen();pub({t:"join",host});render()}
let CUR=0;function saveCur(){const m=load("mn-me-"+ROOM)||{};m.k=CUR;store("mn-me-"+ROOM,m)}
const LINK=()=>location.origin+location.pathname+"?r="+ROOM+(SP.get("srv")?"&srv="+SP.get("srv"):"");
function copyLink(){const t="🎮 みんなで ゲーム！ 親族・家族・世帯（10問）\n"+LINK();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("コピーしました。Zoom の チャットに 貼りつけて ください")).catch(()=>prompt("コピーして ください",t))}
function plist(q){const a=q==null?{}:(S.ans[q]||{});return `<div class="ppl">${players().map(id=>`<span class="${q==null?"":id in a?"ok":"wait"}">${q!=null&&id in a?"✅ ":q!=null?"⏳ ":""}${esc(S.players[id].n)}${S.players[id].host?" 👩‍🏫":""}</span>`).join("")}</div>`}
function render(){if(!ROOM)return;
 if(!S.started&&VIEW!=="join"){VIEW="lobby";
  app.innerHTML=`<h1>👥 ロビー</h1><div class="sub">親族・家族・世帯 ／ 10問</div>
  ${HOST?`<div class="card"><b>① この リンクを Zoom の チャットに 送って ください</b><div class="link">${esc(LINK())}</div><button class="btn b" onclick="copyLink()">📋 リンクを コピー</button></div>`:""}
  <div class="card"><b>入った 人（${players().length}人）</b>${plist()}
  ${HOST?`<button class="btn" onclick="pub({t:'start'})" ${players().length<1?"disabled":""}>▶ ② 全員 そろったら スタート</button>`:`<div class="sub" style="text-align:center;margin-top:12px"><span class="spin">⏳</span> 先生が スタートするのを 待って います<br><span class="mm">ဆရာ စတင်တာ စောင့်နေပါ</span></div>`}</div><div class="st" id="st"></div>`;return}
 if(S.started&&VIEW==="lobby"){VIEW="play";CUR=(load("mn-me-"+ROOM)||{}).k||0}
 if(VIEW!=="play")return;
 if(CUR>=Q.length)return final();
 const q=Q[CUR],a=S.ans[CUR]||{},mine=a[ME.id];
 if(mine===undefined){app.innerHTML=`<div class="hud"><span>問題 ${CUR+1} / ${Q.length}</span><span>${esc(ME.n)}</span></div><div class="card"><div class="qtx">${q.t}</div><div class="chs">${q.c.map((c,k)=>`<button class="c${k}" onclick="answer(${k})">${c}</button>`).join("")}</div></div><div class="card"><b>答えた 人 ${Object.keys(a).length} / ${players().length}</b>${plist(CUR)}</div><div class="st" id="st"></div>`;return}
 if(!revealed(CUR)){app.innerHTML=`<div class="hud"><span>問題 ${CUR+1} / ${Q.length}</span><span>${esc(ME.n)}</span></div><div class="card" style="text-align:center"><div class="qtx" style="min-height:60px;font-size:18px">${q.t}</div><div style="font-size:15px">あなたの 答え：<b style="color:${COL[mine]}">${q.c[mine]}</b></div><div style="margin-top:12px"><span class="spin">⏳</span> みんなを 待って います… ${Object.keys(a).length} / ${players().length}人</div></div><div class="card">${plist(CUR)}${HOST?`<button class="btn g" onclick="pub({t:'reveal',q:${CUR}})">⏩ 待たないで 答えを 見せる（先生）</button>`:""}</div><div class="st" id="st"></div>`;return}
 const ok=mine===q.a;
 app.innerHTML=`<div class="hud"><span>問題 ${CUR+1} / ${Q.length}</span><span>⭐ ${score(ME.id)}点</span></div><div class="card"><div class="qtx" style="min-height:60px;font-size:18px">${q.t}</div>
 <div style="text-align:center;font-size:26px;font-weight:900;color:${ok?"#2b8a3e":"#e03131"}">${ok?"⭕ 正解！":mine===-1?"⏰":"❌ ざんねん"}</div>
 <div class="sub" style="text-align:center;margin:4px 0">答え：<b>${q.c[q.a]}</b>${q.e?" ／ "+q.e:""}</div>
 <b style="display:block;margin-top:8px">👀 みんなの 答え</b>${q.c.map((c,k)=>{const who=Object.keys(a).filter(id=>a[id]===k);return `<div class="ans ${k===q.a?"right":""}"><div class="h"><span class="dot" style="background:${COL[k]}"></span>${c}${k===q.a?" ✅":""}<span class="n">${who.length}人</span></div><div class="ppl">${who.map(id=>`<span>${esc((S.players[id]||{}).n||"?")}</span>`).join("")}</div></div>`}).join("")}
 ${players().filter(id=>!(id in a)).length?`<div class="sub" style="margin-top:6px">答えなかった 人：${players().filter(id=>!(id in a)).map(id=>esc(S.players[id].n)).join("、")}</div>`:""}</div>
 <button class="btn" onclick="CUR++;saveCur();render();scrollTo(0,0)">${CUR<Q.length-1?"次の 問題 ›":"🏆 結果を 見る"}</button><div class="st" id="st"></div>`}
function answer(k){if((S.ans[CUR]||{})[ME.id]!==undefined)return;(S.ans[CUR]=S.ans[CUR]||{})[ME.id]=k;render();pub({t:"ans",q:CUR,c:k})}
function final(){const ids=players(),done=Q.every((_,k)=>revealed(k));
 const L=ids.map(id=>({id,n:S.players[id].n,s:score(id)})).sort((a,b)=>b.s-a.s);
 app.innerHTML=`<h1>🏆 結果</h1>${done?"":`<div class="sub"><span class="spin">⏳</span> まだ 答えて いる 人が います。点数は 変わります。</div>`}
 <div class="card">${L.map((p,k)=>`<div class="rk"><span class="md">${["🥇","🥈","🥉"][k]||k+1}</span><b>${esc(p.n)}${p.id===ME.id?"（あなた）":""}</b><span class="sc">${p.s} / ${Q.length}</span></div>`).join("")}</div>
 <div class="card"><b>📊 問題ごとの 正解者</b><table class="tbl"><tr><th>問題</th><th>答え</th><th>正解</th></tr>${Q.map((q,k)=>{const a=S.ans[k]||{};const c=Object.values(a).filter(x=>x===q.a).length;return `<tr><td>問${k+1} ${q.t.length>16?q.t.slice(0,16)+"…":q.t}</td><td>${q.c[q.a]}</td><td style="font-weight:900;color:${c===ids.length?"#2b8a3e":c<ids.length/2?"#e03131":"#2b2118"}">${c}/${ids.length}</td></tr>`}).join("")}</table><div class="sub" style="margin-top:6px">赤い 問題は 半分 以上が まちがえました。もう一度 説明しましょう。</div></div>
 <a class="btn g" href="game.html">🎮 ゲームに もどる</a>${HOST?`<button class="btn" onclick="location.href=location.pathname+(SP.get('srv')?'?srv='+SP.get('srv'):'')">🏠 新しい ルーム</button>`:""}<div class="st" id="st"></div>`}
setInterval(()=>{if(VIEW==="final")return},5000);
{const r=SP.get("r");if(r&&/^[a-z0-9]{6,16}$/.test(r)){ROOM=r;if(load("mn-host-"+r)&&load("mn-name")){enter(load("mn-name"),true)}else joinView()}else home()}
</script></body></html>
