 else if(r==="culture"){setTitle("🇲🇲 ミャンマー文化メモ");main.innerHTML=CULTURE.map(c=>`<div class="culture"><b>■ ${c[0]}</b><br>${c[1]}</div>`).join("")}
}
function listView(title,list,emptyMsg){setTitle(title);let mode="list",i=0,show=false;
 const draw=()=>{const tabs=`<div class="tabs"><button class="${mode==="list"?"on":""}" data-m="list">📋 一覧</button><button class="${mode==="flash"?"on":""}" data-m="flash">🃏 カード</button></div>`;
  if(!list.length){main.innerHTML=`<div class="empty">${emptyMsg||"ありません"}</div>`;return}
  if(mode==="list"){main.innerHTML=tabs+list.map(card).join("");bindFav()}
  else{const w=list[i];main.innerHTML=tabs+`<div class="flash" id="fl">${show?`<div class="my mm">${w[2]}</div><div class="kana">${w[3]}</div><div style="font-size:16px;color:#888;margin-top:8px">${w[1]}</div><div class="en" style="font-size:14px">${en(w)}</div>${w[4]?`<div class="note" style="margin-top:10px;font-size:13px;color:#8a7d55">💡 ${w[4]}</div>`:""}`:`<div class="jp">${w[1]}</div><div class="en" style="font-size:16px;margin-top:4px">${en(w)}</div><div class="hint">ミャンマー語で何と言う？<br>タップして答えを見る</div>`}</div>
   <div class="nav"><button id="fs">🔊 発音を聞く</button></div><div class="nav"><button id="pv">← 前へ</button><button class="pri" id="nx">次へ →</button></div><div style="text-align:center;color:#999;font-size:13px;margin-top:8px">${i+1} / ${list.length}</div>`;
   $("#fl").onclick=()=>{show=!show;draw()};$("#fs").onclick=()=>speak(w);$("#pv").onclick=()=>{i=(i-1+list.length)%list.length;show=false;draw()};$("#nx").onclick=()=>{i=(i+1)%list.length;show=false;draw()}}
  main.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;i=0;show=false;draw()})};
 draw()}

function abcView(){setTitle('<span class="mm">ကခဂ</span> ミャンマー文字');let tab="con",sel=null;
 const draw=()=>{const tabs=`<div class="tabs"><button class="${tab==="con"?"on":""}" data-t="con">子音 33</button><button class="${tab==="vow"?"on":""}" data-t="vow">母音</button><button class="${tab==="dig"?"on":""}" data-t="dig">数字</button></div>`;
  let h=tabs;
  if(tab==="con"){const a=sel!=null?ABC[sel]:null;
   if(a)h+=`<div class="big1"><div class="L">${a[0]}</div><div class="S">${a[1]}</div><div class="R">${a[2]}</div><div class="N">名前：<span class="mm">${a[3]}</span>（${a[4]}）</div>${a[5]?`<div class="M">💡 ${a[5]}</div>`:""}<div class="nav"><button id="ap">←</button><button class="pri" id="an">次の文字 →</button></div></div>`;
   else h+=`<div style="font-size:13px;color:#6b6b5e;margin-bottom:10px;line-height:1.7">ミャンマー文字は<b>33の子音</b>が基本。丸い形が多いのは、昔ヤシの葉に書いていて、まっすぐな線だと葉が破れたからと言われています。文字をタップしてみよう👇</div>`;
   h+=`<div class="abcgrid">${ABC.map((x,i)=>`<button class="abc" data-i="${i}" style="${i===sel?"outline:3px solid var(--y)":""}"><span class="L">${x[0]}</span><span class="S">${x[1].replace(/（.*）/,"")}</span></button>`).join("")}</div>`;
   h+=`<div class="nav"><button class="pri" id="aq">🎯 文字クイズ</button></div>`}
  else if(tab==="vow"){h+=`<div style="font-size:13px;color:#6b6b5e;margin-bottom:10px;line-height:1.7">母音は、子音の<b>上・下・左・右</b>に記号をつけて表します。ここでは「က（カ）」を使った例です。</div>`+VOW.map(v=>`<div class="vrow"><div class="L">${v[0]}</div><div><div class="S">${v[1]} <span style="color:#999;font-weight:400;font-size:12px">${v[2]}</span></div><div class="M">${v[3]}</div></div></div>`).join("")}
  else{h+=`<div class="abcgrid">${DIG.map(d=>`<div class="abc"><span class="L">${d[0]}</span><span class="S">${d[1]}　${d[2]}</span></div>`).join("")}</div><div style="font-size:13px;color:#6b6b5e;margin-top:10px;line-height:1.7">例：<span class="mm" style="font-size:20px">၂၀၂၆</span> ＝ 2026。お札や値段、バスの番号にも使われています。</div>`}
  main.innerHTML=h;
  main.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel=null;draw()});
  main.querySelectorAll(".abc[data-i]").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;draw();window.scrollTo({top:0,behavior:"smooth"})});
  const ap=$("#ap"),an=$("#an"),aq=$("#aq");if(ap)ap.onclick=()=>{sel=(sel-1+ABC.length)%ABC.length;draw()};if(an)an.onclick=()=>{sel=(sel+1)%ABC.length;draw()};if(aq)aq.onclick=()=>go("abcquiz")};
 draw()}
function abcQuiz(){setTitle("🎯 文字クイズ");let n=0,ok=0;const pool=ABC.filter(a=>!/パーリ|あまり使わない/.test(a[5]));
 const next=()=>{if(n>=10){main.innerHTML=`<div class="qbox" style="text-align:center"><div style="font-size:60px">${ok>=9?"🏆":ok>=6?"⭐":"🌱"}</div><div class="qq">${ok} / 10 正解</div><div class="nav"><button class="pri" id="again">もう一回</button><button id="hm">もどる</button></div></div>`;$("#again").onclick=abcQuiz;$("#hm").onclick=()=>history.back();return}
  const a=pool[Math.floor(Math.random()*pool.length)];const rev=Math.random()<.5;
  const others=pool.filter(x=>x!==a&&x[1]!==a[1]).sort(()=>Math.random()-.5).slice(0,3);const opts=[a,...others].sort(()=>Math.random()-.5);
  main.innerHTML=`<div class="score"><span>第${n+1}問 / 10</span><span>正解 ${ok}</span></div><div class="qbox"><div class="qt">${rev?"この音の文字はどれ？":"この文字の音は？"}</div><div class="qq" style="text-align:center">${rev?`<span style="font-size:36px;color:var(--g)">${a[1]}</span><div style="font-size:14px;color:#999">${a[2]}</div>`:`<span class="mm" style="font-size:80px;line-height:1.4">${a[0]}</span>`}</div>
   ${opts.map((o,k)=>`<button class="opt" data-k="${k}" style="${rev?"text-align:center":""}">${rev?`<span class="mm" style="font-size:34px">${o[0]}</span>`:`${o[1]} <small style="display:inline;color:#999">${o[2]}</small>`}</button>`).join("")}</div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(main.querySelector(".opt.ok"))return;const pick=opts[+b.dataset.k];main.querySelectorAll(".opt").forEach((x,k)=>{if(opts[k]===a)x.classList.add("ok")});if(pick===a)ok++;else b.classList.add("ng");n++;setTimeout(next,pick===a?700:1500)})};
 next()}
function quiz(){setTitle("🎯 クイズ");let n=0,ok=0;const pool=W.slice();
 const next=()=>{if(n>=10){const msg=ok>=9?"すばらしい！🎉":ok>=6?"よくできました！👏":"もう一回やってみよう💪";
   main.innerHTML=`<div class="qbox" style="text-align:center"><div style="font-size:60px">${ok>=9?"🏆":ok>=6?"⭐":"🌱"}</div><div class="qq">${ok} / 10 正解</div><div style="font-size:18px">${msg}</div><div class="nav"><button class="pri" id="again">もう一回</button><button id="hm">ホームへ</button></div></div>`;$("#again").onclick=quiz;$("#hm").onclick=()=>history.back();return}
  const w=pool[Math.floor(Math.random()*pool.length)];const rev=Math.random()<.5;
  const others=W.filter(x=>x!==w&&x[0]===w[0]).sort(()=>Math.random()-.5).slice(0,3);
  while(others.length<3){const x=W[Math.floor(Math.random()*W.length)];if(x!==w&&!others.includes(x))others.push(x)}
  const opts=[w,...others].sort(()=>Math.random()-.5);
  main.innerHTML=`<div class="score"><span>第${n+1}問 / 10</span><span>正解 ${ok}</span></div><div class="qbox"><div class="qt">${rev?"この言葉の意味は？":"ミャンマー語で何と言う？"}</div><div class="qq ${rev?"mm":""}">${rev?w[2]+`<div style="font-size:16px;color:#2a9d63">${w[3]}</div>`:w[1]+`<div class="en" style="font-size:15px">${en(w)}</div>`}</div>
   ${opts.map((o,k)=>`<button class="opt" data-k="${k}">${rev?o[1]+`<span class="en" style="display:block">${en(o)}</span>`:`<span class="mm">${o[2]}</span><small>${o[3]}</small>`}</button>`).join("")}</div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(main.querySelector(".opt.ok"))return;const pick=opts[+b.dataset.k];main.querySelectorAll(".opt").forEach((x,k)=>{if(opts[k]===w)x.classList.add("ok")});if(pick===w)ok++;else b.classList.add("ng");n++;setTimeout(next,pick===w?700:1500)})};
 next()}

function bsel(k){document.querySelectorAll("#bnav button").forEach(b=>b.classList.toggle("on",b.dataset.b===k))}
document.querySelectorAll("#bnav button").forEach(b=>b.onclick=()=>{const k=b.dataset.b;if(k==="home"){history.pushState(null,"");home()}else go(k)});
back.onclick=()=>history.back();
window.onpopstate=e=>{e.state&&e.state.r?route(e.state.r):home()};
const setEn=v=>{localStorage.setItem('mm-en',v?'1':'0');document.body.classList.toggle('hide-en',!v);$('#entg').textContent=v?'EN ON':'EN OFF';$('#entg').style.opacity=v?1:.5};
setEn(localStorage.getItem('mm-en')!=='0');$('#entg').onclick=()=>setEn(document.body.classList.contains('hide-en'));
home();
</script>
