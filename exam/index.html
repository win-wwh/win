function start(list,mode){
  S={list,i:0,ok:0,mode,ans:null,per:{},start:Date.now(),order:list.map(q=>shuffle(q[4].map((t,j)=>[t,j])))};
  if(mode==="mock"){S.end=Date.now()+60*60*1000;timer=setInterval(()=>{const el=document.getElementById("tm");if(!el)return;const r=Math.max(0,S.end-Date.now());el.textContent=fmt(r);if(r<=0){clearInterval(timer);result()}},1000)}
  show();
}
const fmt=ms=>{const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};

  app.innerHTML=`<header><button class="back" data-home="1" aria-label="ホーム">✕</button><div style="flex:1"><div class="qtop"><span>${S.i+1} / ${S.list.length}</span>${S.mode==="mock"?`<span class="timer">⏱ <span id="tm">${fmt(S.end-Date.now())}</span></span>`:`<span>正解 ${S.ok}</span>`}</div><div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div></div></header>
  <div class="qbox"><span class="tag">${c.ic} ${c.jp}</span>${q[1]?`<div class="qemo">${q[1]}</div>`:""}<div class="qjp" style="margin-top:10px">${q[2]}</div>${showMM?`<div class="qmm mm">${q[3]}</div>`:""}</div>
  ${ord.map(([t,j],k)=>{let cls="";if(answered){if(j===0)cls="ok";else if(k===S.ans)cls="ng"}return `<button class="opt ${cls}" data-a="${k}" ${answered?"disabled":""}><span class="k">${"ABC"[k]}</span><span>${t}</span></button>`}).join("")}
  ${answered?`<div class="exp"><b>${ord[S.ans][1]===0?"⭕ 正解！":"❌ ざんねん"}</b><br>${q[5]}${showMM?`<div class="mm" style="margin-top:6px;color:#5b5236">${q[6]}</div>`:""}</div><button class="next" data-next="1">${S.i===S.list.length-1?"結果を見る":"次へ ▶"}</button>`:""}`;
}
function answer(k){
  const q=S.list[S.i],ok=S.order[S.i][k][1]===0;S.ans=k;
  const id=Q.indexOf(q);const st=stats[q[0]]||(stats[q[0]]={c:0,t:0});st.t++;
  const pc=S.per[q[0]]||(S.per[q[0]]={c:0,t:0});pc.t++;
  if(ok){S.ok++;st.c++;pc.c++;wrong.delete(id)}else wrong.add(id);
  save();show();
}
function result(){
  clearInterval(timer);
  const p=Math.round(S.ok/S.list.length*100);
  if(S.mode==="mock"&&(stats.best==null||p>stats.best)){stats.best=p;save()}
  app.innerHTML=`<header><button class="back" data-home="1">✕</button><h1>結果</h1></header>
  <div class="qbox score"><div class="big">${S.ok} / ${S.list.length}</div><div style="font-size:20px;margin-top:4px">${p}%</div><p>${p>=70?"よくできました！この調子でがんばりましょう 🎉":"まちがえた問題を復習しましょう 💪"}</p><p class="mm">${p>=70?"တော်ပါတယ်! ဆက်ကြိုးစားပါ":"မှားခဲ့သော မေးခွန်းများကို ပြန်လေ့ကျင့်ပါ"}</p></div>
  ${Object.entries(S.per).map(([k,v])=>`<div class="card"><span class="ic" style="background:${CATS[k].bg}">${CATS[k].ic}</span><span style="flex:1"><b>${CATS[k].jp}</b><div class="bar"><i style="width:${v.c/v.t*100}%"></i></div></span><span class="right">${v.c}/${v.t}</span></div>`).join("")}
  ${wrong.size?`<button class="next" data-go="wrong" style="margin-top:8px">まちがえた問題を練習する</button>`:""}
  <button class="ghost" data-home="1">ホームにもどる</button>
  <p class="note">※ 本番の合格基準は公開されている点数ではなく、問題の難易度などで調整されます。練習の目安にしてください。</p>`;
}
function mock(){
  let list=[];for(const [k,c] of Object.entries(CATS))list=list.concat(shuffle(Q.filter(q=>q[0]===k)).slice(0,c.n));
  return list;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.home){home();window.scrollTo(0,0)}
  else if(b.dataset.go==="mock"){start(mock(),"mock")}
  else if(b.dataset.go==="rand"){start(shuffle(Q).slice(0,10),"rand")}
  else if(b.dataset.go==="wrong"){if(!wrong.size)return;start(shuffle([...wrong].map(i=>Q[i])),"wrong")}
  else if(b.dataset.cat){start(shuffle(Q.filter(q=>q[0]===b.dataset.cat)),"cat")}
  else if(b.dataset.mm){showMM=!showMM;LS.set("mm",showMM);home()}
  else if(b.dataset.reset){wrong=new Set();stats={};save();home()}
  else if(b.dataset.a!=null){if(S.ans==null)answer(+b.dataset.a)}
  else if(b.dataset.next){if(S.i===S.list.length-1)result();else{S.i++;S.ans=null;show();window.scrollTo(0,0)}}
  else return;
});
home();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{})</script>
</body>
