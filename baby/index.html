<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{background:#fff6dc;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;color:#5a4636;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation;transition:background .3s}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 22px}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
h1{text-align:center;font-size:30px;margin:6px 0 2px}
.sub{text-align:center;color:#a08a72;font-size:14px;margin:0 0 16px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{border-radius:26px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:54px;box-shadow:0 6px 0 rgba(90,70,54,.18);transition:transform .1s}
.tile span{font-size:14px;margin-top:4px;color:#5a4636;white-space:nowrap}
.tile:active,.card:active,.home:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(90,70,54,.18)}
.lang{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.lang button{border-radius:999px;background:#fff;padding:9px 16px;font-size:14px;box-shadow:0 3px 0 rgba(90,70,54,.12)}
.lang button.on{background:#5a4636;color:#fff}
.note{text-align:center;font-size:12px;color:#b9a48b;margin-top:14px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.home{width:64px;height:64px;border-radius:22px;background:#fff;font-size:32px;box-shadow:0 5px 0 rgba(90,70,54,.18);flex:none}
.top b{font-size:24px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:230px;border-radius:30px;background:rgba(255,255,255,.75);margin:6px 0 14px;padding:14px;text-align:center}
.emo{font-size:110px;line-height:1.05}
.emo.boing{animation:boing .55s}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(.92) rotate(6deg)}100%{transform:scale(1)}}
.name{font-size:36px;margin-top:6px;min-height:46px}
.snd{font-size:20px;color:#a08a72;min-height:28px}
.mm{font-family:"Noto Sans Myanmar","Myanmar Text",sans-serif;font-size:20px;color:#8a7360;min-height:32px}
.again{font-size:12px;color:#c4af95;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{border-radius:24px;background:#fff;aspect-ratio:1;font-size:48px;box-shadow:0 5px 0 rgba(90,70,54,.15);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .1s}
.card.sel{outline:4px solid #ffb703;outline-offset:2px}
.dot{width:68%;height:68%;border-radius:50%}
#play{position:relative;height:calc(100vh - 140px);min-height:420px;border-radius:30px;background:#fff;overflow:hidden;box-shadow:0 5px 0 rgba(90,70,54,.15);touch-action:none}
#play .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#c9b391;pointer-events:none;text-align:center;line-height:1.7}
.pop{position:absolute;border-radius:50%;pointer-events:none;animation:pop 1.1s ease-out forwards;display:flex;align-items:center;justify-content:center}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}70%{opacity:.95}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
#piano{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:calc(100vh - 140px);min-height:380px;touch-action:none}
.key{border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;color:#fff;font-size:18px;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .08s}

.peek{width:100%;height:calc(100vh - 150px);min-height:400px;border-radius:30px;background:#fff;box-shadow:0 5px 0 rgba(90,70,54,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:150px}
.peek small{font-size:30px;margin-top:10px}
.qq{display:grid;grid-template-columns:1fr;gap:14px}
.qq .card{aspect-ratio:auto;height:150px;font-size:96px}
.wiggle{animation:wig .4s}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pal{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.pal button{width:40px;height:40px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.pal button.on{outline:4px solid #5a4636;outline-offset:2px}
#cv{width:100%;height:calc(100vh - 210px);min-height:360px;border-radius:24px;background:#fff;box-shadow:0 5px 0 rgba(90,70,54,.15);touch-action:none;display:block}
.night{position:relative;height:calc(100vh - 140px);min-height:420px;border-radius:30px;background:#141a36;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8e6ff}
.star{position:absolute;color:#fff6b0;animation:tw 2.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.playbtn{margin-top:20px;width:110px;height:110px;border-radius:50%;background:#ffe9a8;font-size:44px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
</style>

  ["🍞","ぱん","ふわふわ","ပေါင်မုန့်","Bread","Fluffy"],["🍙","おにぎり","もぐもぐ","ထမင်းလုံး","Rice ball","Yum"],
  ["🥛","ぎゅうにゅう","ごくごく","နွားနို့","Milk","Gulp"],["🍰","けーき","おいしいね","ကိတ်မုန့်","Cake","Yummy"]]},

  ["#9ca3af","はいいろ","","မီးခိုးရောင်","Gray",""],["#06b6d4","みずいろ","","အပြာနု","Light blue",""]]},

  ["10","じゅう","","တစ်ဆယ် ၁၀","Ten",""]]},
 shape:{icon:"🔺",jp:"かたち",items:[
  ["🔴","まる","","စက်ဝိုင်း","Circle",""],["🔺","さんかく","","တြိဂံ","Triangle",""],

 piano:{icon:"🎹",jp:"ぴあの"},

};
const ORDER=["animal","car","fruit","boo","quiz","color","num","shape","body","piano","draw","play","sleep"];
const BG={animal:"#ffe2c6",car:"#d6ecff",fruit:"#ffd9de",color:"#f1e4ff",num:"#dff6e4",shape:"#fff0b8",body:"#ffe4ef",piano:"#e2e8ff",play:"#d9f5f5",boo:"#ffe8cc",quiz:"#e6f4ff",draw:"#fff",sleep:"#1e2445",home:"#fff6dc"};
const TILE={animal:"#ffcf9f",car:"#a9d5ff",fruit:"#ffb3be",color:"#dcc4ff",num:"#b9ebc5",shape:"#ffe27a",body:"#ffc2d9",piano:"#c3cdff",play:"#a8e6e6",boo:"#ffd29a",quiz:"#b5dcff",draw:"#ffd6a5",sleep:"#9aa5d6"};
let mode="home",lang="ja",sel=null;
try{lang=localStorage.getItem("baby-lang")||"ja"}catch(e){}

let ac=null;
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(f,t,d,v,type="sine"){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function chime(){if(!audio())return;const t=ac.currentTime;[0,4,7].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),t+i*.07,.5,.12,"triangle"))}
function click(){if(!audio())return;tone(880,ac.currentTime,.15,.08,"sine")}
const PENTA=[0,2,4,7,9,12,14,16];
function note(i){if(!audio())return;tone(392*Math.pow(2,PENTA[i%PENTA.length]/12),ac.currentTime,.7,.15,"triangle")}
function speak(text,l){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=l;u.rate=l==="ja-JP"?.8:.85;u.pitch=1.3;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith(l.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}


function confetti(){const E=["🎉","⭐","💖","✨","🌈"];for(let i=0;i<14;i++){const d=document.createElement("div");d.className="pop";d.textContent=E[i%E.length];const s=50+Math.random()*40;d.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:${30+Math.random()*50}vh;width:${s}px;height:${s}px;font-size:${s*.6}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),1150)}}
let lullOn=false,lullTimer=null,lullStop=null,ln=0,lstep=0;
const LULL=[67,64,67,null,69,67,64,null,62,64,65,64,62,null,60,null,64,62,60,null,62,64,67,null,69,67,64,62,60,null,null,null];
function startLull(){if(!audio())return;lullOn=true;ln=ac.currentTime+.1;lstep=0;lullTimer=setInterval(()=>{while(ln<ac.currentTime+.5){const n=LULL[lstep%LULL.length];if(n){tone(440*Math.pow(2,(n-69)/12),ln,1.6,.09,"sine");tone(440*Math.pow(2,(n-57)/12),ln,1,.02,"sine")}if(lstep%8===0)tone(440*Math.pow(2,(48-69)/12),ln,3,.04,"sine");ln+=.55;lstep++}},120);clearTimeout(lullStop);lullStop=setTimeout(stopLull,5*60*1000)}
function stopLull(){lullOn=false;clearInterval(lullTimer);clearTimeout(lullStop);const b=document.getElementById("lull");if(b)b.textContent="▶︎"}
const app=document.getElementById("app");
function white(c){return c==="#ffffff"?"box-shadow:inset 0 0 0 3px #e5d6bd;":""}
function face(it){
  if(mode==="num")return `<span style="font-size:42px;font-weight:700">${it[0]}</span>`;
  if(mode==="color")return `<span class="dot" style="background:${it[0]};${white(it[0])}"></span>`;
  return it[0];
}
function bigFace(it){
  if(!it)return "👇";
  if(mode==="num")return `<div style="font-size:96px;font-weight:700">${it[0]}</div><div style="font-size:26px;line-height:1.3;max-width:300px;margin:4px auto 0">${"🍎".repeat(+it[0])}</div>`;
  if(mode==="color")return `<span style="display:inline-block;width:110px;height:110px;border-radius:50%;background:${it[0]};${white(it[0])}"></span>`;
  return it[0];
}
function topBar(){return `<div class="top"><button class="home" data-home="1" aria-label="ホーム">🏠</button><b>${SETS[mode].icon} ${SETS[mode].jp}</b></div>`}
function render(){
  document.body.style.background=BG[mode];
  if(mode==="home"){
    app.innerHTML=`<h1>タッチであそぼ</h1><p class="sub">すきなのを えらんでね</p>
    <div class="menu">${ORDER.map(k=>`<button class="tile" data-mode="${k}" style="background:${TILE[k]}">${SETS[k].icon}<span>${SETS[k].jp}</span></button>`).join("")}</div>
    <div class="lang">${[["ja","にほんご"],["en","English"],["mm","မြန်မာ"]].map(([k,v])=>`<button class="${k===lang?"on":""}" data-lang="${k}">${v}</button>`).join("")}</div>
    <p class="note">おとが でないときは マナーモードを かいじょしてね</p>`;
    return;
  }
  if(mode==="boo"){
    app.innerHTML=topBar()+`<button class="peek" id="peek">🙈<small>さわってね</small></button>`;
    let open=false;
    document.getElementById("peek").onclick=()=>{
      const p=document.getElementById("peek");open=!open;
      if(open){const pool=SETS.animal.items;const it=pool[Math.random()*pool.length|0];p.innerHTML=`${it[0]}<small>ばあ！</small>`;p.classList.remove("wiggle");void p.offsetWidth;p.classList.add("wiggle");chime();speak(lang==="en"?"Peekaboo!":"ばあ！",lang==="en"?"en-US":"ja-JP")}
      else{p.innerHTML=`🙈<small>いないいない…</small>`;click();speak(lang==="en"?"Where is it?":"いないいない","ja-JP".replace("ja-JP",lang==="en"?"en-US":"ja-JP"))}
    };
    return;
  }
  if(mode==="quiz"){
    const pool=[...SETS.animal.items,...SETS.fruit.items,...SETS.car.items];
    const pick=[];while(pick.length<3){const x=pool[Math.random()*pool.length|0];if(!pick.includes(x))pick.push(x)}
    const ans=pick[Math.random()*3|0];
    const q=lang==="en"?`Where is the ${ans[4].toLowerCase()}?`:`${ans[1]}は どれかな？`;
    app.innerHTML=topBar()+`<div class="big" style="min-height:90px"><div class="name" style="font-size:28px">${q}</div><div class="mm">${ans[3]}</div></div><div class="qq">${pick.map((x,i)=>`<button class="card" data-q="${pool.indexOf(x)}">${x[0]}</button>`).join("")}</div>`;
    setTimeout(()=>speak(q,lang==="en"?"en-US":"ja-JP"),300);
    app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
      const x=pool[+b.dataset.q];
      if(x===ans){b.style.background="#c8f7c5";chime();speak(lang==="en"?"Great job!":"せいかい！すごいね！",lang==="en"?"en-US":"ja-JP");confetti();setTimeout(render,1600)}
      else{b.classList.remove("wiggle");void b.offsetWidth;b.classList.add("wiggle");if(audio())tone(220,ac.currentTime,.25,.1,"sine")}
    });

    app.innerHTML=topBar()+`<div class="pal">${COLS.map((c,i)=>`<button data-c="${c}" class="${i===0?"on":""}" style="background:${c}"></button>`).join("")}<button data-clear="1" style="background:#fff;font-size:24px">🧽</button></div><canvas id="cv"></canvas>`;
    const cv=document.getElementById("cv"),dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
    const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=14;let col=COLS[0],last=null,pn=0;
    app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{col=b.dataset.c;app.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x===b));click()});
    app.querySelector("[data-clear]").onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);if(audio())[784,659,523].forEach((f,i)=>tone(f,ac.currentTime+i*.08,.3,.08))};
    const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);last=pos(e);ctx.fillStyle=col;ctx.beginPath();ctx.arc(last[0],last[1],7,0,7);ctx.fill();note(pn++)};
    cv.onpointermove=e=>{if(!last)return;const p=pos(e);ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};
    cv.onpointerup=cv.onpointercancel=()=>last=null;
    return;
  }
  if(mode==="sleep"){
    let stars="";for(let i=0;i<28;i++)stars+=`<span class="star" style="left:${Math.random()*95}%;top:${Math.random()*90}%;font-size:${10+Math.random()*16}px;animation-delay:${Math.random()*2.5}s">✦</span>`;
    app.innerHTML=topBar().replace('<b>','<b style="color:#e8e6ff">')+`<div class="night">${stars}<div style="font-size:90px;position:relative">🌙</div><div style="font-size:24px;position:relative;margin-top:8px">おやすみなさい</div><button class="playbtn" id="lull" style="position:relative">${lullOn?"⏸":"▶︎"}</button><div style="font-size:12px;opacity:.6;position:relative;margin-top:12px">5ふんで しぜんに とまります</div></div>`;
    document.getElementById("lull").onclick=()=>{lullOn?stopLull():startLull();document.getElementById("lull").textContent=lullOn?"⏸":"▶︎"};
    return;
  }
  if(mode==="piano"){
    const K=[["ど","#ef4444"],["れ","#fb923c"],["み","#facc15"],["ふぁ","#22c55e"],["そ","#06b6d4"],["ら","#3b82f6"],["し","#a855f7"],["ど","#f472b6"]];
    app.innerHTML=topBar()+`<div id="piano">${K.map((k,i)=>`<div class="key" data-k="${i}" style="background:${k[1]}">${k[0]}</div>`).join("")}</div>`;
    const SC=[0,2,4,5,7,9,11,12];
    document.getElementById("piano").addEventListener("pointerdown",e=>{const k=e.target.closest(".key");if(!k)return;e.preventDefault();if(!audio())return;const i=+k.dataset.k;tone(261.63*Math.pow(2,SC[i]/12),ac.currentTime,.9,.18,"triangle");tone(261.63*Math.pow(2,SC[i]/12+1),ac.currentTime,.5,.04,"sine");k.style.transform="translateY(5px)";setTimeout(()=>k.style.transform="",150)});
    return;
  }
  if(mode==="play"){
    app.innerHTML=topBar()+`<div id="play"><div class="hint">どこでも さわってみてね<br>👆</div></div>`;bindPlay();return;
  }
  const items=SETS[mode].items;const it=sel!=null?items[sel]:null;
  const nm=it?(lang==="en"?it[4]:it[1]):"どれかな？";
  const sd=it?(lang==="en"?it[5]:it[2]):"";
  app.innerHTML=topBar()+`<button class="big" id="bigbtn" style="width:100%"><div class="emo" id="emo">${bigFace(it)}</div>
   <div class="name">${nm}</div><div class="snd">${sd||""}</div><div class="mm">${it?it[3]:""}</div>
   ${it?'<div class="again">もういちど さわると また きこえるよ</div>':''}</button>
   <div class="grid">${items.map((x,i)=>`<button class="card ${i===sel?"sel":""}" data-i="${i}" aria-label="${x[1]}">${face(x)}</button>`).join("")}</div>`;
}
function tap(i){
  sel=i;render();chime();
  const it=SETS[mode].items[i];
  const e=document.getElementById("emo");e.classList.remove("boing");void e.offsetWidth;e.classList.add("boing");
  setTimeout(()=>{
    if(lang==="en")speak(it[4]+(it[5]?"! "+it[5]:""),"en-US");
    else speak(it[1]+(it[2]?"、"+it[2]:""),"ja-JP");
  },250);
}
const POPC=["#ff8fa3","#ffd166","#06d6a0","#4cc9f0","#b388eb","#ff9f1c"];
const POPE=["⭐","💖","🌸","🫧","🌈","✨","🎵","🍭"];
let pi=0;
function bindPlay(){
  const pl=document.getElementById("play");
  pl.addEventListener("pointerdown",e=>{
    e.preventDefault();const r=pl.getBoundingClientRect();
    const hint=pl.querySelector(".hint");if(hint)hint.remove();
    const d=document.createElement("div");d.className="pop";const s=80+Math.random()*60;
    d.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;width:${s}px;height:${s}px;background:${POPC[pi%POPC.length]};font-size:${s*.5}px`;
    d.textContent=POPE[Math.random()*POPE.length|0];
    pl.appendChild(d);setTimeout(()=>d.remove(),1150);note(pi);pi++;
  });
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.home){stopLull();mode="home";sel=null;click();render();window.scrollTo(0,0)}
  else if(b.dataset.mode){mode=b.dataset.mode;sel=null;click();render();window.scrollTo(0,0)}
  else if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem("baby-lang",lang)}catch(e){}click();render()}
  else if(b.dataset.i!=null)tap(+b.dataset.i);
  else if(b.id==="bigbtn"&&sel!=null)tap(sel);
});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
render();
</script>
</body>
</html>
