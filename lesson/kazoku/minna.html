<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなで あそぶ：親族・家族・世帯</title><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#fff4e6,#ffe8cc);min-height:100vh;color:#2b2118;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.mm{font-family:"Noto Sans Myanmar","Myanmar Sangam MN",sans-serif;color:#6741d9}
.wrap{max-width:560px;margin:auto;padding:12px 14px 40px}
a.back,button.back{background:none;border:0;padding:0;color:#d9480f;font-weight:800;font-size:15px;text-decoration:none;font-family:inherit}
h1{font-size:24px;margin:6px 0 2px}.sub{color:#7a6550;font-size:13px;line-height:1.6;margin-bottom:12px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 0 #f0c9a0;margin-bottom:12px}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:900;background:#fd7e14;color:#fff;width:100%;margin-top:10px;box-shadow:0 4px 0 #d9480f;font-family:inherit}
.btn.g{background:#fff;color:#d9480f;box-shadow:0 4px 0 #f0c9a0}.btn.line{background:#06c755;box-shadow:0 4px 0 #04a144}
.code{font-size:64px;font-weight:900;letter-spacing:10px;text-align:center;color:#d9480f;margin:4px 0}
input,textarea{width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid #f0c9a0;font-family:inherit}textarea{font-size:14px;min-height:140px}
.hud{display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin:6px 0 8px}
.tbar{height:10px;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:10px}.tbar i{display:block;height:100%;background:#fd7e14}
.qtx{font-size:21px;font-weight:900;text-align:center;line-height:1.6;min-height:96px;display:flex;align-items:center;justify-content:center}
.qno{text-align:center;font-weight:900;color:#d9480f}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chs button{border:0;border-radius:16px;font-size:26px;font-weight:900;padding:16px 0;color:#fff;font-family:inherit}
.c0{background:#e8590c;box-shadow:0 4px 0 #b8430a}.c1{background:#1c7ed6;box-shadow:0 4px 0 #1864ab}.c2{background:#2b8a3e;box-shadow:0 4px 0 #1f6b2f}.c3{background:#ae3ec9;box-shadow:0 4px 0 #862e9c}.c4{background:#495057;box-shadow:0 4px 0 #343a40}
.chs button:disabled{opacity:.35}.chs button.ans{opacity:1;outline:5px solid #ffd43b}
.big .qtx{font-size:30px;min-height:160px}.big .chs button{font-size:34px;padding:22px 0}
.rk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f3e3d0;font-size:17px}.rk b{flex:1}.rk .md{font-size:26px;width:36px;text-align:center}.rk .sc{font-weight:900;color:#d9480f}
.bar2{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.bar2 .t{flex:1}.bar2 i{display:block;height:12px;background:#ff8787;border-radius:6px}
.step{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px;line-height:1.6}.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:#fd7e14;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.fl{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);font-size:110px;opacity:0;pointer-events:none;transition:.25s}.fl.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style></head><body><div class="wrap" id="app"></div><div class="fl" id="fl"></div>
<script src="game-data.js"></script>
<script>
const app=document.getElementById("app"),$=i=>document.getElementById(i);
const NQ=10,SEC=15;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shS(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// ルーム番号から 同じ 問題を つくる
function makeQ(code){const r=rng(+code*7919);const ox=shS(OX,r).slice(0,6).map(o=>({t:o[0],c:["○","✕"],a:o[1]?0:1,e:o[2]}));
 const sn=shS(N.filter(n=>n[0]!=="honnin"),r).slice(0,4).map(n=>{const opts=n[4]==="なし"?["1","2","3","なし"]:["1","2","3","4"];if(n[4]!=="なし"&&!opts.includes(String(n[4])))opts[3]=String(n[4]);return{t:`本人から 見て「${n[1]}」は 何親等？`,c:opts.map(o=>o==="なし"?"なし":o+"親等"),a:opts.indexOf(String(n[4])),e:n[5]}});
 return shS([...ox,...sn],r)}
const LINK=c=>location.origin+location.pathname+"?room="+c;
function sendText(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else location.href="https://line.me/R/share?text="+encodeURIComponent(t)}
function flash(ok){const f=$("fl");f.textContent=ok?"⭕":"❌";f.classList.add("on");setTimeout(()=>f.classList.remove("on"),380)}
let ROOM=null,Q=[],I=0,ANS=[],T0=0,TM=null,TL=0;
function getN(){try{return localStorage.getItem("stu-name")||""}catch(e){return""}}
function setN(v){try{localStorage.setItem("stu-name",v)}catch(e){}}

/* ===== はじめ ===== */
function home(){clearInterval(TM);scrollTo(0,0);history.replaceState(null,"",location.pathname);
 app.innerHTML=`<a class="back" href="game.html">‹ ゲーム</a><h1>👥 みんなで あそぶ</h1><div class="sub">親族・家族・世帯 ／ 同じ 問題 10問で 勝負！<br><span class="mm">အတူတူ ဆော့ပြီး ပြိုင်ကြမယ်</span></div>
 <div class="card"><b>👩‍🏫 先生</b><div class="step"><span class="n">1</span><span>ルームを 作る → 生徒の LINEグループに リンクを 送る</span></div><div class="step"><span class="n">2</span><span>みんなで 同時に スタート（先生の 画面を 見せながら でも OK）</span></div><div class="step"><span class="n">3</span><span>生徒が LINEグループに 結果を 送る → 先生が コピーして ランキング</span></div>
 <button class="btn" onclick="tHome()">🏠 ルームを 作る（先生）</button></div>
 <div class="card"><b>🎒 生徒</b> <span class="mm" style="font-size:13px">ကျောင်းသား</span><div class="sub" style="margin:6px 0">先生から 聞いた ルーム番号を 入れて ください</div>
 <input id="rc" inputmode="numeric" maxlength="4" placeholder="ルーム番号（4けた）"><button class="btn" onclick="const c=$('rc').value.trim();if(!/^\\d{4}$/.test(c)){alert('4けたの 数字を 入れて ください');return}sHome(c)">▶ 入る</button></div>`}

/* ===== 先生 ===== */
function tHome(c){c=c||String(1000+Math.floor(Math.random()*9000));ROOM=c;scrollTo(0,0);
 app.innerHTML=`<button class="back" onclick="home()">‹ もどる</button><div class="card" style="text-align:center"><div class="sub" style="margin:0">ルーム番号</div><div class="code">${c}</div><div class="sub">生徒は この 番号を 入れるか、リンクを 開きます</div>
 <button class="btn line" onclick="sendText('🎮 みんなで ゲーム！\\n親族・家族・世帯（10問）\\nルーム番号：${c}\\n'+LINK('${c}')+'\\n\\n名前を 入れて、先生の 合図で スタート！ 終わったら 結果を この グループに 送って ください。')">📤 生徒に リンクを 送る（LINE）</button>
 <button class="btn" onclick="tPlay()">📺 問題を 大きく 見せる（先生の 画面）</button>
 <button class="btn g" onclick="tRank()">🏆 結果を 集めて ランキング</button>
 <button class="btn g" onclick="tHome()">🔄 新しい ルーム</button></div>`}
function tPlay(){Q=makeQ(ROOM);I=0;tShow()}
function tShow(rev){clearInterval(TM);const q=Q[I];scrollTo(0,0);
 app.innerHTML=`<button class="back" onclick="tHome('${ROOM}')">‹ ルーム ${ROOM}</button><div class="card big"><div class="qno">${I+1} / ${Q.length}</div><div class="qtx">${q.t}</div>
 <div class="chs">${q.c.map((c,k)=>`<button class="c${q.c.length===2?k:k} ${rev&&k===q.a?"ans":""}" ${rev&&k!==q.a?"disabled":""}>${c}</button>`).join("")}</div>
 ${rev?`<div class="sub" style="text-align:center;margin-top:10px;font-size:16px">${q.e||""}</div>`:""}</div>
 ${rev?`<button class="btn" onclick="I++;I<Q.length?tShow():tHome('${ROOM}')">${I<Q.length-1?"次の 問題 ›":"おわり → ランキングへ"}</button>`:`<button class="btn" onclick="tShow(1)">💡 答えを 見せる</button>`}`}
function tRank(){scrollTo(0,0);
 app.innerHTML=`<button class="back" onclick="tHome('${ROOM}')">‹ ルーム ${ROOM}</button><h1>🏆 ランキング</h1><div class="sub">LINEグループの 結果メッセージを 長押し → コピー して、下に 貼りつけて ください（何人分でも まとめて OK）</div>
 <textarea id="pt" placeholder="ここに 貼りつけ"></textarea><button class="btn" onclick="rank()">🏆 ランキングを 出す</button><div id="rk"></div>`}
function rank(){const txt=$("pt").value;const re=/#R(\d{4})\s*\|\s*([^|\n]+?)\s*\|\s*(\d+)\s*\|\s*(\d+)\s*\|\s*([01]+)/g;let m,P={};
 while(m=re.exec(txt)){if(m[1]!==ROOM)continue;P[m[2]]={n:m[2],s:+m[3],t:+m[4],b:m[5]}}
 const L=Object.values(P).sort((a,b)=>b.s-a.s||a.t-b.t);
 if(!L.length){$("rk").innerHTML=`<div class="card">ルーム ${ROOM} の 結果が 見つかりません。「#R${ROOM}」が 入った メッセージを 貼って ください。</div>`;return}
 Q=makeQ(ROOM);const miss=Q.map((q,k)=>({q,k,n:L.filter(p=>p.b[k]==="0").length})).sort((a,b)=>b.n-a.n);
 $("rk").innerHTML=`<div class="card">${L.map((p,k)=>`<div class="rk"><span class="md">${["🥇","🥈","🥉"][k]||k+1}</span><b>${p.n}</b><span class="sc">${p.s}点</span><span style="color:#7a6550;font-size:13px">${p.t}秒</span></div>`).join("")}</div>
 <div class="card"><b>❌ まちがいが 多かった 問題</b><div class="sub" style="margin:4px 0 8px">授業で もう一度 説明しましょう</div>${miss.filter(x=>x.n).slice(0,5).map(x=>`<div class="bar2"><span class="t">問${x.k+1} ${x.q.t}<br><small style="color:#2b8a3e">答え：${x.q.c[x.q.a]}</small></span><span style="width:70px"><i style="width:${x.n/L.length*100}%"></i></span><b>${x.n}人</b></div>`).join("")||"全員 全問 正解！ 🎉"}</div>
 <button class="btn line" onclick="sendText(RT())">📤 ランキングを LINEに 送る</button>`;window._L=L}
function RT(){return `🏆 ランキング（ルーム ${ROOM}）\n`+window._L.map((p,k)=>`${["🥇","🥈","🥉"][k]||(k+1)+"位"} ${p.n} ${p.s}点（${p.t}秒）`).join("\n")}

/* ===== 生徒 ===== */
function sHome(c){ROOM=c;history.replaceState(null,"",location.pathname+"?room="+c);scrollTo(0,0);
 app.innerHTML=`<button class="back" onclick="home()">‹ もどる</button><div class="card" style="text-align:center"><div class="sub" style="margin:0">ルーム</div><div class="code" style="font-size:44px">${c}</div>
 <input id="nm" placeholder="名前（例：Aung）" value="${getN().replace(/"/g,"")}"><div class="sub" style="margin-top:8px">先生の 合図で スタート！ 1問 ${SEC}秒、全部で ${NQ}問<br><span class="mm">ဆရာ အချက်ပြမှ စပါ</span></div>
 <button class="btn" onclick="const n=$('nm').value.trim().replace(/[|#]/g,'');if(!n){alert('名前を 入れて ください');return}setN(n);sStart()">▶ スタート</button></div>`}
function sStart(){Q=makeQ(ROOM);I=0;ANS=[];T0=Date.now();sShow()}
function sShow(){clearInterval(TM);const q=Q[I];TL=SEC*10;scrollTo(0,0);
 app.innerHTML=`<div class="hud"><span>${I+1} / ${Q.length}</span><span>⭕ ${ANS.filter(x=>x).length}</span></div><div class="tbar"><i id="tb" style="width:100%"></i></div>
 <div class="card"><div class="qtx">${q.t}</div><div class="chs">${q.c.map((c,k)=>`<button class="c${k}" onclick="sAns(${k})">${c}</button>`).join("")}</div><div class="sub" id="ex" style="text-align:center;margin-top:10px;min-height:1.5em"></div></div>`;
 TM=setInterval(()=>{TL--;$("tb").style.width=(TL/SEC/10*100)+"%";if(TL<=0)sAns(-1)},100)}
function sAns(k){clearInterval(TM);const q=Q[I];const ok=k===q.a;ANS.push(ok);flash(ok);
 document.querySelectorAll(".chs button").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("ans")});
 $("ex").innerHTML=(k<0?"⏰ 時間 切れ　":"")+(q.e||"");
 setTimeout(()=>{I++;if(I<Q.length)sShow();else sEnd()},ok?800:1700)}
function sEnd(){const s=ANS.filter(x=>x).length,t=Math.round((Date.now()-T0)/1000),n=getN();scrollTo(0,0);
 const msg=`🎮 みんなで ゲーム 結果\n名前：${n}\n${s} / ${Q.length} 正解（${t}秒）\n#R${ROOM}|${n}|${s}|${t}|${ANS.map(x=>x?1:0).join("")}`;
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:70px">${s===Q.length?"🏆":s>=7?"🌟":"💪"}</div><h1>${s} / ${Q.length} 正解</h1><div class="sub">${t}秒</div>
 <button class="btn line" onclick='sendText(${JSON.stringify(msg)})'>📤 LINEグループに 結果を 送る</button><div class="sub" style="margin-top:8px">⚠️ 最後の 行（#R…）は 消さないで ください。先生の ランキングに 使います<br><span class="mm">#R… စာကြောင်းကို မဖျက်ပါနဲ့</span></div>
 <button class="btn g" onclick="sHome('${ROOM}')">🔁 もう一回</button><a class="btn g" href="game.html">🎮 ほかの ゲーム</a></div>`}

{const c=new URLSearchParams(location.search).get("room");if(c&&/^\d{4}$/.test(c))sHome(c);else home()}
</script></body></html>
