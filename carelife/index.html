<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--ink:#2b2622;--g:#2fb39a;--o:#f4a261}
html,body{margin:0;height:100%;overflow:hidden;background:#fdf6ec;color:var(--ink);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
.mm{font-family:"Noto Sans Myanmar","Myanmar Sangam MN","Myanmar Text",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
.hud{display:flex;align-items:center;gap:8px;padding:8px 2px 6px}
.clock{background:var(--ink);color:#fff;border-radius:14px;padding:6px 10px;font-weight:900;font-size:18px;min-width:84px;text-align:center}
.clock small{display:block;font-size:10px;opacity:.8;font-weight:700}
.mis{flex:1;background:#fff;border-radius:14px;padding:6px 10px;font-size:13px;font-weight:800;line-height:1.35;box-shadow:0 1px 4px #0001}
.mis small{display:block;color:#8a7f72;font-weight:600;font-size:11px}
.hud button{border:0;background:#fff;border-radius:10px;width:36px;height:36px;font-size:16px;box-shadow:0 1px 4px #0001}
.prog{display:flex;gap:3px;padding:0 4px 6px}
.prog i{flex:1;height:6px;border-radius:3px;background:#eadfce}
.prog i.d{background:var(--g)}.prog i.c{background:var(--o)}
.mapw{flex:1;position:relative;min-height:0}
#map{position:absolute;left:50%;top:50%;width:360px;height:480px;transform-origin:center;background:#e9dcc7;border-radius:22px;box-shadow:inset 0 0 0 6px #d8c6a8}
#map.night{filter:brightness(.62) saturate(.8)}
.rm{position:absolute;border-radius:14px;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#5b4636;box-shadow:0 3px 0 #0000001a}
.rm .ic{font-size:30px;line-height:1}
.rm .pp{position:absolute;bottom:4px;right:6px;font-size:24px}
.rm.tg{box-shadow:0 0 0 4px #ffb703,0 3px 0 #0000001a;animation:pul 1s infinite}
@keyframes pul{50%{box-shadow:0 0 0 8px #ffb70366,0 3px 0 #0000001a}}
.ex{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:26px;animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translate(-50%,-6px)}}
.hall{position:absolute;left:10px;right:10px;top:132px;height:50px;border-radius:10px;background:repeating-linear-gradient(90deg,#f7efe2 0 24px,#efe4d2 24px 48px);display:flex;align-items:center;justify-content:center;color:#a8957a;font-weight:800;font-size:12px}
#me{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;font-size:38px;line-height:44px;text-align:center;transition:left .7s ease-in-out,top .7s ease-in-out;z-index:5;filter:drop-shadow(0 3px 2px #0003)}
#me.walk{animation:wk .18s infinite alternate}
@keyframes wk{to{transform:translateY(-4px) rotate(4deg)}}
.think{position:absolute;z-index:6;background:#fff;border-radius:12px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap;transform:translate(-50%,-150%);box-shadow:0 2px 6px #0002;pointer-events:none}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:#0005}
.ov.center{align-items:center;background:#fdf6ecf5}
.sc{width:100%;max-width:560px;background:#fff;border-radius:26px 26px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92vh;overflow:auto;animation:sl .25s}
@keyframes sl{from{transform:translateY(40%)}}
.ov.center .sc{border-radius:26px;max-width:420px;margin:16px;text-align:center;animation:none;background:none}
.stage{border-radius:18px;padding:12px;display:flex;gap:12px;align-items:flex-end;min-height:120px;position:relative}
.stage .who{font-size:64px;line-height:1}
.stage .nm{font-size:12px;font-weight:800;color:#6b5646;text-align:center}
.say{flex:1;background:#fff;border-radius:16px;padding:10px 12px;position:relative;box-shadow:0 2px 6px #00000014;margin-bottom:22px}
.say:before{content:"";position:absolute;left:-10px;bottom:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.say .jp{font-size:19px;font-weight:900;line-height:1.4}
.say .mm{font-size:13px;color:#7a6f64;margin-top:2px;line-height:1.7}
.say button{position:absolute;right:6px;top:6px;border:0;background:#f3ece2;border-radius:10px;font-size:14px;padding:4px 7px}
.sit{font-size:13px;color:#6b5646;font-weight:700;margin:10px 2px 0;line-height:1.6}
.q{font-size:16px;font-weight:900;margin:12px 2px 8px}
.ch{display:block;width:100%;text-align:left;border:2px solid #eadfce;background:#fff;border-radius:16px;padding:12px 14px;font-size:15px;font-weight:700;font-family:inherit;color:var(--ink);margin-bottom:8px;line-height:1.5}
.ch.ok{border-color:var(--g);background:#e3f6f0}
.ch.ng{border-color:#e85d4a;background:#fde8e6}
.ch:disabled{opacity:.55}.ch.ok:disabled{opacity:1}
.exp{border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.7;margin-top:6px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:14px;font-size:17px;font-weight:900;font-family:inherit;margin-top:10px;background:var(--g);color:#fff;box-shadow:0 5px 0 #1f8a76}
.btn.o{background:var(--o);box-shadow:0 5px 0 #d4833f}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e8dccb}
.btn small{display:block;font-size:12px;opacity:.9;font-weight:700}
h1{font-size:30px;margin:6px 0 2px;font-weight:900}
.tl{text-align:left;background:#fff;border-radius:16px;padding:10px 14px;font-size:13px;line-height:1.9;margin:10px 0}
.stars{font-size:46px;letter-spacing:4px}
.lst{text-align:left;background:#fff;border-radius:16px;padding:4px 12px;margin:10px 0;max-height:36vh;overflow:auto}
.lst div{padding:8px 0;border-bottom:1px solid #f1e8dc;font-size:13px;line-height:1.5}
.lst div:last-child{border:0}
.tgl{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-top:10px;color:#6b5646}
.tgl input{width:20px;height:20px}
.heart{position:fixed;font-size:28px;z-index:40;pointer-events:none;animation:hu 1.2s forwards}
@keyframes hu{to{transform:translateY(-120px) scale(1.4);opacity:0}}
</style>
</head>

<div id="app">
 <div class="hud"><div class="clock" id="clk">7:00<small>あさ</small></div><div class="mis" id="mis"></div><button id="snd">🔊</button></div>

 <div class="mapw" id="mapw"><div id="map"></div></div>

<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let sound=LS("carelife-sound",true),showMM=LS("carelife-mm",true),rec=LS("carelife-rec",{days:0,best:0});
let jaV=null;function pickV(){try{const v=speechSynthesis.getVoices();jaV=v.find(x=>/^ja/i.test(x.lang)&&/Kyoko|O-ren/.test(x.name))||v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function say(t,f){if(!sound&&!f)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[…\s]/g,""));u.lang="ja-JP";u.rate=.9;if(jaV)u.voice=jaV;speechSynthesis.speak(u)}catch(e){}}
const ROOMS={
 r1:{x:10,y:10,w:105,h:115,n:"101号室",ic:"🛏️",c:"#ffe3d1",p:"👵"},
 r2:{x:127,y:10,w:106,h:115,n:"102号室",ic:"🛏️",c:"#dff0ff",p:"👴"},
 r3:{x:245,y:10,w:105,h:115,n:"103号室",ic:"🛏️",c:"#efe3ff",p:"👵🏻"},
 din:{x:10,y:190,w:165,h:140,n:"食堂",ic:"🍽️",c:"#fff1c9"},
 hall:{x:185,y:190,w:165,h:140,n:"ホール",ic:"🎵",c:"#dff5e8"},
 wc:{x:10,y:340,w:105,h:130,n:"トイレ",ic:"🚽",c:"#e4f1f3"},
 bath:{x:127,y:340,w:106,h:130,n:"お風呂",ic:"🛁",c:"#d6eefc"},
 st:{x:245,y:340,w:105,h:130,n:"スタッフ室",ic:"📋",c:"#f3ece2"}
};
const P={tanaka:["👵","田中さん"],suzuki:["👴","鈴木さん"],sato:["👵🏻","佐藤さん"],nurse:["👩🏻‍⚕️","看護師さん"],lead:["🧑🏻‍💼","リーダー"]};
// [time,label,room,who,bg,line,mm,situation,[[question,[[choice,ok,explain],...]],...]]
const DAY=[
 ["7:00","あさ","r1","tanaka","#ffe3d1","……すう、すう（ねている）","(အိပ်နေတယ်)","起きる時間です。右手と右足に まひ（片麻痺）が あります。",
  [["さいしょに 何て 声を かける？",[["「田中さん、おはようございます。よく眠れましたか？」",1,"名前を呼んで、やさしく あいさつ。朝の気分や体調も わかります。"],["「起きて！もう時間ですよ！」",0,"急がせると、びっくりして 不安になります。"],["だまって カーテンを 開ける",0,"何も言わずに始めると、こわく感じます。まず声かけ。"]]],
   ["パジャマを 着がえます。どちらの腕から 袖を通す？",[["右（まひのある方）から",1,"着るときは 患側（まひのある方）から。「脱健着患（だっけんちゃっかん）」と覚えよう。"],["左（よく動く方）から",0,"着るときは まひのある方から。脱ぐときは よく動く方から です。"]]]]],
 ["7:30","あさ","wc","suzuki","#e4f1f3","トイレに 行きたいんだけど…","အိမ်သာ သွားချင်တယ်","鈴木さんは 歩くとき 少し ふらつきます。",
  [["何て 答える？",[["「はい、一緒に行きましょう。ゆっくりで大丈夫ですよ」",1,"気持ちよく 返事をして、安全に 付きそいます。"],["「さっき 行きましたよね？」",0,"トイレの回数を 責めると、がまんして しまいます。"],["「おむつだから 大丈夫ですよ」",0,"自分で行きたい 気持ちを 大切に（自立支援）。"]]]]],
 ["8:00","あさ","din","sato","#fff1c9","いただきます","ထမင်းစားမယ်","朝ごはんの時間。佐藤さんは 飲みこむ力が 少し弱いです。",
  [["食べるときの 姿勢は どれがいい？",[["いすに深く座って、あごを 少し引く",1,"あごを引くと 誤嚥（ごえん）しにくく なります。足は 床に つけます。"],["上を向いて 食べる",0,"上を向くと 食べ物が 気管に入りやすく 危ないです。"],["ベッドで ねたまま 食べる",0,"ねたままだと 誤嚥の 危険が 高いです。"]]],
   ["ゴホゴホ！ 強く むせた！ どうする？",[["食事を止めて、前かがみで 咳をしてもらう",1,"まず咳で出してもらう。顔色が悪い・息が苦しそうなら すぐ看護師へ。"],["すぐに お水を 飲ませる",0,"むせている時に 水を飲むと、もっと むせます。"]]]]],
 ["9:00","あさ","st","nurse","#f3ece2","田中さんの 体温、どうだった？","တာနာကာစံ ကိုယ်အပူချိန် ဘယ်လောက်လဲ","田中さんの体温を はかったら 37.8℃ でした。いつもは 36.3℃ です。",
  [["どうする？",[["看護師さんに すぐ 報告する",1,"いつもと違う時は すぐ報告。数字（37.8℃）と 様子を 正確に 伝えます。"],["少し 様子を見て、だれにも 言わない",0,"熱は 病気のサインかも。報告が大切です。"],["自分の 判断で 薬を 飲ませる",0,"介護職が 自分の判断で 薬を出すことは できません。"]]]]],
 ["10:00","ひる","bath","suzuki","#d6eefc","お風呂、楽しみだなあ","ရေချိုးရမှာ ပျော်တယ်","鈴木さんの 入浴の時間です。",
  [["お湯の 温度は どうする？",[["自分で 確かめてから、鈴木さんにも 確かめてもらう",1,"目安は 38〜41℃。介護者と本人の 両方で 確かめると 安心です。"],["熱いほうが 温まるので 熱めにする",0,"熱すぎると やけどや 血圧の変化が 心配です。"]]],
   ["お風呂から 出たあとは？",[["水分（お茶など）を とってもらう",1,"入浴で 汗をかくので、水分補給が 大切です。"],["すぐに 外へ 散歩に行く",0,"入浴後は 疲れやすく、湯冷めも します。まずは休憩と水分。"]]]]],
 ["12:00","ひる","din","tanaka","#fff1c9","今日は… ごはん いらない","ဒီနေ့ ထမင်း မစားချင်ဘူး","お昼ごはんを ほとんど 食べていません。",
  [["どうする？",[["理由を聞いて、食べられそうな物を 一緒に考える",1,"体調・気分・好み など、理由を さがします。食べた量も 記録して 報告。"],["がんばって 口に 入れる",0,"無理に食べさせると 誤嚥の 危険が あります。"],["何も言わずに 片付ける",0,"食べない理由（体調の変化）を 見のがしてしまいます。"]]]]],
 ["14:00","ひる","hall","sato","#dff5e8","歌は にがてなのよ…","သီချင်းဆိုရတာ မကျွမ်းကျင်ဘူး","ホールで 歌のレクリエーションです。",
  [["何て 声を かける？",[["「見ているだけでも 大丈夫ですよ。手拍子だけでも 楽しいですよ」",1,"本人の 気持ちを 大切に。参加の しかたを えらんでもらいます。"],["「全員参加です！歌ってください」",0,"むりに 参加させると、レクが きらいに なります。"],["「じゃあ、部屋に もどりましょう」",0,"一人に すると さみしくなります。いろいろな 参加の形が あります。"]]]]],
 ["15:00","ひる","r2","suzuki","#dff0ff","さいふが ない！ だれかに とられた！","ပိုက်ဆံအိတ် ပျောက်သွားပြီ","鈴木さんは 認知症が あります。さいふは 引き出しに しまってあります。",
  [["どうする？",[["「それは 心配ですね。一緒に さがしましょう」",1,"否定しないで 気持ちを 受けとめ、一緒に さがします。本人が 見つけられると 安心します。"],["「だれも とっていません！」と 強く言う",0,"否定されると、もっと 不安や 怒りが 大きくなります。"],["「また 忘れたんですか？」",0,"失敗を 責める 言葉は、本人を 傷つけます。"]]]]],
 ["17:30","ゆうがた","hall","tanaka","#ffe1cf","そろそろ 家に 帰らなきゃ。子どもが 待ってるの","အိမ်ပြန်ရမယ်။ ကလေးတွေ စောင့်နေတယ်","夕方になると、帰りたくなる 気持ちが 強くなります（帰宅願望）。",
  [["どうする？",[["「お子さんの こと、教えてください」と 話を聞く",1,"気持ちを 受けとめて、話を聞きます。安心すると 落ち着きます。"],["「ここが あなたの家です！」と 言う",0,"気持ちを 否定すると、不安が 大きくなります。"],["玄関に カギを かけて 何も言わない",0,"閉じこめられた 気持ちに なります。まず 気持ちに よりそう。"]]]]],
 ["21:00","よる","r3","sato","#2c3557","ねむれないの…","အိပ်လို့ မရဘူး","消灯の時間です。",
  [["どうする？",[["温かい飲み物を 少し出して、話を 聞く",1,"安心できると 眠りやすく なります。カフェインの ない 飲み物に します。"],["「早く 寝てください」と 電気を 消す",0,"命令されると 安心できず、もっと 眠れません。"],["睡眠薬を 自分の判断で あげる",0,"薬は 医師・看護師の 指示が 必要です。"]]]]],
 ["2:00","しんや","r1","tanaka","#1f2640","（ナースコール）トイレに 行きたいの","အိမ်သာ သွားချင်တယ်","夜中に ナースコールが 鳴りました。",
  [["どうする？",[["すぐに行って、足元を 明るくして 付きそう",1,"夜は 暗くて 転びやすい 時間。足元の明かりと 付きそいで 転倒を 防ぎます。"],["朝まで がまんしてもらう",0,"がまんは 体に 悪く、一人で 行こうとして 転ぶ 原因に なります。"],["電話で「一人で 行ってください」",0,"夜は 転倒が 多い 時間です。付きそいが 安心です。"]]]]],
 ["7:00","あさ","st","lead","#f3ece2","おつかれさま。申し送り、お願いします","လွှဲပြောင်းမှု ပြောပါ","夜勤が 終わり、次のスタッフへ 申し送り（ひきつぎ）です。",
  [["どう 伝える？",[["「田中さん、2時に トイレ介助。転倒なし。37.8℃の件は 看護師に報告済みです」",1,"いつ・だれが・何を・どうした を、事実で 正確に 伝えます。"],["「とくに 何も なかったです」",0,"小さなことも 大切な 情報です。正確に 伝えましょう。"],["「田中さん、たぶん 大丈夫だと 思います」",0,"「たぶん」「思う」ではなく、見たこと（事実）を 伝えます。"]]]]]
];
let S=null,me={x:180,y:157},scale=1;
function fit(){const w=$("#mapw"),m=$("#map");scale=Math.min(w.clientWidth/360,w.clientHeight/480);m.style.transform=`translate(-50%,-50%) scale(${scale})`}
addEventListener("resize",fit);
function drawMap(){const ev=S&&DAY[S.i],tg=ev&&ev[2];
 $("#map").innerHTML=`<div class="hall">ろうか</div>`+Object.entries(ROOMS).map(([id,r])=>`<div class="rm${id===tg?" tg":""}" data-room="${id}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${r.c}"><span class="ic">${r.ic}</span>${r.n}${r.p?`<span class="pp">${r.p}</span>`:""}${id===tg?`<span class="ex">❗</span>`:""}</div>`).join("")+`<div id="me" style="left:${me.x}px;top:${me.y}px">👩🏻‍⚕️</div>`;
 const night=ev&&["よる","しんや"].includes(ev[1]);$("#map").classList.toggle("night",!!night);
 document.querySelectorAll("[data-room]").forEach(el=>el.onclick=()=>go(el.dataset.room))}
function hud(){const ev=DAY[S.i];$("#clk").innerHTML=`${ev[0]}<small>${ev[1]}</small>`;
 const r=ROOMS[ev[2]],who=P[ev[3]];$("#mis").innerHTML=`${who[0]} ${who[1]}のところへ（${r.n}）<small>❗の 部屋を タッチ</small>`;
 $("#prog").innerHTML=DAY.map((d,i)=>`<i class="${i<S.i?"d":i===S.i?"c":""}"></i>`).join("")}
function go(id){if(!S||S.busy)return;const r=ROOMS[id];const x=r.x+r.w/2,y=r.y+r.h/2;
 // walk: via hallway
 const el=$("#me");S.busy=true;el.classList.add("walk");
 const hy=157;const steps=[[me.x,hy],[x,hy],[x,y]];let k=0;
 const next=()=>{if(k>=steps.length){el.classList.remove("walk");me={x,y};S.busy=false;arrive(id);return}const [sx,sy]=steps[k++];
  const d=Math.hypot(sx-parseFloat(el.style.left),sy-parseFloat(el.style.top));el.style.transition=`left ${d/260}s linear,top ${d/260}s linear`;el.style.left=sx+"px";el.style.top=sy+"px";setTimeout(next,d/260*1000+20)};next()}
function arrive(id){const ev=DAY[S.i];
 if(id!==ev[2]){const t=document.createElement("div");t.className="think";t.textContent=["ここじゃないみたい🤔","❗の部屋へ行こう","だれも よんでないね"][Math.random()*3|0];t.style.left=me.x+"px";t.style.top=me.y+"px";$("#map").appendChild(t);setTimeout(()=>t.remove(),1300);return}
 scene()}
function scene(){const ev=DAY[S.i],who=P[ev[3]];S.q=0;S.tries=0;say(ev[5]);
 const dark=ev[4].startsWith("#1")||ev[4].startsWith("#2");
 const draw=()=>{const [q,chs]=ev[8][S.q];if(!S.order)S.order=chs.map((c,i)=>i).sort(()=>Math.random()-.5);
  $("#sc").innerHTML=`<div class="stage" style="background:${ev[4]}"><div><div class="who">${who[0]}</div><div class="nm" style="color:${dark?"#fff":"#6b5646"}">${who[1]}</div></div>
   <div class="say"><div class="jp">${ev[5]}</div>${showMM&&ev[6]?`<div class="mm">${ev[6]}</div>`:""}<button id="rp">🔊</button></div></div>
   ${S.q===0?`<div class="sit">📝 ${ev[7]}</div>`:""}<div class="q">❓ ${q}</div>
   ${S.order.map(i=>`<button class="ch" data-c="${i}">${chs[i][0]}</button>`).join("")}<div id="ex"></div>`;
  $("#rp").onclick=()=>say(ev[5],true);
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const c=chs[+b.dataset.c];S.tries++;
   if(c[1]){b.classList.add("ok");document.querySelectorAll("[data-c]").forEach(x=>x.disabled=true);
    const pts=S.tries===1?2:1;S.pts+=pts;S.max+=2;if(S.tries===1)S.good++;else S.log.push([q,chs.find(x=>x[1])[0]]);
    hearts(b,S.tries===1?"💖":"💛");say(S.tries===1?"いいですね":"そうですね");
    $("#ex").innerHTML=`<div class="exp" style="background:#e3f6f0"><b>${S.tries===1?"⭕ すばらしい！":"⭕ 正解！"}</b><br>💡 ${c[2]}</div><button class="btn" id="nx">${S.q<ev[8].length-1?"つぎへ ▶":"おわり ▶"}</button>`;
    $("#nx").onclick=()=>{S.order=null;S.tries=0;if(S.q<ev[8].length-1){S.q++;draw()}else done()};$("#ex").scrollIntoView({behavior:"smooth",block:"nearest"})}
   else{b.classList.add("ng");b.disabled=true;$("#ex").innerHTML=`<div class="exp" style="background:#fde8e6"><b>🤔 うーん…</b><br>${c[2]}<br><small>もう一度 えらんでみよう</small></div>`}})};
 S.order=null;draw();$("#ov").className="ov";$("#ov").style.display="flex"}
function hearts(el,e){const b=el.getBoundingClientRect();for(let k=0;k<5;k++){const h=document.createElement("div");h.className="heart";h.textContent=e;h.style.left=b.left+b.width*(.2+k*.15)+"px";h.style.top=b.top+"px";h.style.animationDelay=k*.08+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),1500)}}
function done(){$("#ov").style.display="none";S.i++;if(S.i>=DAY.length){finish();return}
 const prev=DAY[S.i-1][1],cur=DAY[S.i][1];
 if(prev!==cur){center(`<div style="font-size:60px">${{ひる:"☀️",ゆうがた:"🌇",よる:"🌙",しんや:"🌌",あさ:"🌅"}[cur]}</div><h1>${DAY[S.i][0]}</h1><p style="font-weight:800">${{ひる:"お昼の じかん",ゆうがた:"夕方に なりました",よる:"夜の じかん",しんや:"夜中の 見回り",あさ:"朝に なりました"}[cur]}</p><button class="btn" id="ok">つづける ▶</button>`);$("#ok").onclick=()=>{$("#ov").style.display="none";drawMap();hud()}}
 else{drawMap();hud()}}
function center(h){$("#sc").innerHTML=h;$("#ov").className="ov center";$("#ov").style.display="flex"}
function finish(){const pct=S.pts/S.max,stars=pct>=.9?3:pct>=.65?2:1;rec.days++;if(S.pts>rec.best)rec.best=S.pts;localStorage.setItem("carelife-rec",JSON.stringify(rec));say("一日 おつかれさまでした",true);
 center(`<div style="font-size:54px">🎉</div><h1>一日 おつかれさま！</h1><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
 <p style="font-weight:800">笑顔ポイント ${S.pts} / ${S.max} ・ 1回で正解 ${S.good}問<br><span class="mm" style="font-weight:500">တစ်နေ့လုံး ပင်ပန်းခဲ့ပြီ</span></p>
 <p style="font-weight:900;color:#2fb39a">${stars===3?"🏅 すばらしい 介護福祉士！":stars===2?"🌳 たよれる スタッフ！":"🌱 明日も がんばろう！"}</p>
 ${S.log.length?`<div style="text-align:left;font-weight:900;margin-top:6px">📖 ふりかえり（まちがえた所）</div><div class="lst">${S.log.map(l=>`<div>❓ ${l[0]}<br><b style="color:#2fb39a">→ ${l[1]}</b></div>`).join("")}</div>`:""}
 <button class="btn o" id="again">🌅 もう一日 はたらく</button><button class="btn sub" id="share">📤 友だちに送る</button><button class="btn sub" id="home">🏠 タイトルへ</button>`);
 $("#again").onclick=start;$("#home").onclick=titleScr;
 $("#share").onclick=async()=>{const t=`「ケアの一日」で ${"⭐".repeat(stars)}！介護施設の一日を ゲームで体験しよう👇\nhttps://winlabjp.com/carelife/`;try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==="AbortError")return}try{await navigator.clipboard.writeText(t);$("#share").textContent="コピーしました ✓"}catch(e){}}}
function start(){say("おはようございます");S={i:0,pts:0,max:0,good:0,log:[],busy:false};me={x:180,y:157};$("#ov").style.display="none";drawMap();hud();fit()}
function titleScr(){S=null;
 center(`<div style="font-size:60px;line-height:1">🏠👩🏻‍⚕️👵</div><h1>ケアの一日</h1><p style="font-weight:800;margin-top:0">介護施設の 日常生活ゲーム<br><span class="mm" style="font-weight:500">သူနာပြုစောင့်ရှောက်ရေး ဌာနရဲ့ တစ်နေ့တာ</span></p>
 <div class="tl">🌅 7:00 おはよう・着がえ<br>🍚 8:00 朝ごはん　🌡️ 9:00 体温チェック<br>🛁 10:00 お風呂　🎵 14:00 レク<br>🌇 17:30 夕方　🌙 21:00 消灯　🌌 2:00 見回り</div>
 <p style="font-size:13px">❗の部屋を タッチして 行こう。<br>利用者さんに 何て 声を かける？ どうする？</p>
 <button class="btn o" id="go">🌅 一日を はじめる</button>
 <label class="tgl"><input type="checkbox" id="mmT" ${showMM?"checked":""}> ミャンマー語も 表示 <span class="mm">မြန်မာဘာသာ</span></label>
 ${rec.days?`<p style="font-size:12px;color:#8a7f72">はたらいた日：${rec.days}日 ・ ベスト ${rec.best}ポイント</p>`:""}`);
 $("#go").onclick=start;$("#mmT").onchange=e=>{showMM=e.target.checked;localStorage.setItem("carelife-mm",JSON.stringify(showMM))}}
$("#snd").onclick=()=>{sound=!sound;localStorage.setItem("carelife-sound",JSON.stringify(sound));$("#snd").textContent=sound?"🔊":"🔇";if(sound)say("おんせい オン",true)};
$("#snd").textContent=sound?"🔊":"🔇";
S={i:0,pts:0,max:0,good:0,log:[]};drawMap();hud();fit();S=null;titleScr();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{})</script>
</body>
</html>
