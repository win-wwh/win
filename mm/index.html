  <button class="cat wide q-btn" data-go="quiz"><span class="e">🎯</span><span>クイズで覚える<span class="n" style="color:#6b5a00">4択でチャレンジ</span></span></button>
  ${CATS.map(c=>`<button class="cat" data-go="cat:${c[0]}"><span class="e">${c[1]}</span>${c[2]}<span class="n">${W.filter(w=>w[0]===c[0]).length}語</span></button>`).join("")}
  <button class="cat" data-go="fav"><span class="e">⭐</span>お気に入り<span class="n">${fav.size}語</span></button>
  <button class="cat" data-go="culture"><span class="e">🇲🇲</span>ミャンマー文化メモ<span class="n">知っておくと仲よくなれる</span></button>
 </div>`;
 main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 const q=$("#q"),res=$("#res"),grid=$("#grid");
 q.oninput=()=>{const s=q.value.trim();if(!s){res.innerHTML="";grid.style.display="";return}grid.style.display="none";const h=W.filter(w=>(w[1]+w[3]+w[2]+w[4]).includes(s));res.innerHTML=h.length?h.map(card).join(""):`<div class="empty">見つかりませんでした</div>`;bindFav()};
 window.scrollTo(0,0)}
function go(r){history.pushState({r},"");route(r)}
function route(r){sub(true);window.scrollTo(0,0);
 if(r.startsWith("cat:")){const c=CATS.find(x=>x[0]===r.slice(4));listView(c[1]+" "+c[2],W.filter(w=>w[0]===c[0]))}
 else if(r==="fav"){listView("⭐ お気に入り",W.filter(w=>fav.has(id(w))),"まだありません。単語の⭐を押すとここに集まります。")}
 else if(r==="quiz")quiz();
 else if(r==="culture"){setTitle("🇲🇲 ミャンマー文化メモ");main.innerHTML=CULTURE.map(c=>`<div class="culture"><b>■ ${c[0]}</b><br>${c[1]}</div>`).join("")}
}
function listView(title,list,emptyMsg){setTitle(title);let mode="list",i=0,show=false;
 const draw=()=>{const tabs=`<div class="tabs"><button class="${mode==="list"?"on":""}" data-m="list">📋 一覧</button><button class="${mode==="flash"?"on":""}" data-m="flash">🃏 カード</button></div>`;
  if(!list.length){main.innerHTML=`<div class="empty">${emptyMsg||"ありません"}</div>`;return}
  if(mode==="list"){main.innerHTML=tabs+list.map(card).join("");bindFav()}
  else{const w=list[i];main.innerHTML=tabs+`<div class="flash" id="fl">${show?`<div class="my mm">${w[2]}</div><div class="kana">${w[3]}</div><div style="font-size:16px;color:#888;margin-top:8px">${w[1]}</div>${w[4]?`<div class="note" style="margin-top:10px;font-size:13px;color:#8a7d55">💡 ${w[4]}</div>`:""}`:`<div class="jp">${w[1]}</div><div class="hint">ミャンマー語で何と言う？<br>タップして答えを見る</div>`}</div>
   <div class="nav"><button id="pv">← 前へ</button><button class="pri" id="nx">次へ →</button></div><div style="text-align:center;color:#999;font-size:13px;margin-top:8px">${i+1} / ${list.length}</div>`;
   $("#fl").onclick=()=>{show=!show;draw()};$("#pv").onclick=()=>{i=(i-1+list.length)%list.length;show=false;draw()};$("#nx").onclick=()=>{i=(i+1)%list.length;show=false;draw()}}
  main.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;i=0;show=false;draw()})};
 draw()}
function quiz(){setTitle("🎯 クイズ");let n=0,ok=0;const pool=W.slice();
 const next=()=>{if(n>=10){const msg=ok>=9?"すばらしい！🎉":ok>=6?"よくできました！👏":"もう一回やってみよう💪";
   main.innerHTML=`<div class="qbox" style="text-align:center"><div style="font-size:60px">${ok>=9?"🏆":ok>=6?"⭐":"🌱"}</div><div class="qq">${ok} / 10 正解</div><div style="font-size:18px">${msg}</div><div class="nav"><button class="pri" id="again">もう一回</button><button id="hm">ホームへ</button></div></div>`;$("#again").onclick=quiz;$("#hm").onclick=()=>history.back();return}
  const w=pool[Math.floor(Math.random()*pool.length)];const rev=Math.random()<.5;
  const others=W.filter(x=>x!==w&&x[0]===w[0]).sort(()=>Math.random()-.5).slice(0,3);
  while(others.length<3){const x=W[Math.floor(Math.random()*W.length)];if(x!==w&&!others.includes(x))others.push(x)}
  const opts=[w,...others].sort(()=>Math.random()-.5);
  main.innerHTML=`<div class="score"><span>第${n+1}問 / 10</span><span>正解 ${ok}</span></div><div class="qbox"><div class="qt">${rev?"この言葉の意味は？":"ミャンマー語で何と言う？"}</div><div class="qq ${rev?"mm":""}">${rev?w[2]+`<div style="font-size:16px;color:#2a9d63">${w[3]}</div>`:w[1]}</div>
   ${opts.map((o,k)=>`<button class="opt" data-k="${k}">${rev?o[1]:`<span class="mm">${o[2]}</span><small>${o[3]}</small>`}</button>`).join("")}</div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(main.querySelector(".opt.ok"))return;const pick=opts[+b.dataset.k];main.querySelectorAll(".opt").forEach((x,k)=>{if(opts[k]===w)x.classList.add("ok")});if(pick===w)ok++;else b.classList.add("ng");n++;setTimeout(next,pick===w?700:1500)})};
 next()}
back.onclick=()=>history.back();
window.onpopstate=e=>{e.state&&e.state.r?route(e.state.r):home()};
home();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/win/sw.js").catch(()=>{})</script>
</body>
</html>
