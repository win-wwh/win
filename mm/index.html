<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.wrap{max-width:620px;margin:0 auto;padding:12px 14px 60px}

.flag{width:40px;height:28px;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 1px 3px #0003;position:relative;background:linear-gradient(var(--y) 0 33.3%,var(--g) 33.3% 66.6%,var(--r) 66.6%)}

.hero{background:linear-gradient(135deg,var(--g),#2a9d63);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 14px #1b7a4a44}
.hero .big{font-size:30px;font-weight:700;margin:2px 0}
.hero .k{font-size:15px;opacity:.95}
.hero .t{font-size:12px;opacity:.85;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{border:0;background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 1px 4px #0001;font-size:15px;font-weight:700;color:#222}

.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px}
.wide .e{margin:0}
.q-btn{background:var(--y)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ddd5c0;font-size:16px;margin-bottom:12px;background:#fff}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px #0001;display:flex;gap:10px;align-items:flex-start}
.card .main{flex:1;min-width:0}
.card .jp{font-size:13px;color:#6b6b5e}
.card .my{font-size:24px;line-height:1.7;margin:2px 0;word-break:break-word}
.card .kana{font-size:16px;font-weight:700;color:var(--g)}
.card .note{font-size:12px;color:#8a7d55;margin-top:4px;background:#fbf6e4;border-radius:8px;padding:4px 8px}
.fav{border:0;background:none;font-size:22px;padding:0 2px;opacity:.35}
.fav.on{opacity:1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:12px;padding:10px;font-size:14px;font-weight:700;background:#e8e2cf;color:#6b6b5e}
.tabs button.on{background:var(--g);color:#fff}
.flash{background:#fff;border-radius:22px;min-height:300px;box-shadow:0 4px 16px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash .my{font-size:40px;line-height:1.6}
.flash .kana{font-size:22px;color:var(--g);font-weight:700;margin-top:8px}
.flash .jp{font-size:26px;font-weight:700}
.flash .hint{font-size:12px;color:#aaa;margin-top:18px}
.nav{display:flex;gap:10px;margin-top:12px}
.nav button{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#fff;box-shadow:0 1px 3px #0002}
.nav .pri{background:var(--g);color:#fff}
.qbox{background:#fff;border-radius:20px;padding:20px;box-shadow:0 2px 10px #0001}
.qbox .qt{font-size:13px;color:#888}
.qbox .qq{font-size:26px;font-weight:700;margin:6px 0 14px;line-height:1.5}
.opt{display:block;width:100%;border:2px solid #e8e2cf;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left;font-size:18px;line-height:1.6}

const CULTURE=[
 ["名字がない","ミャンマー人には、ふつう<b>名字（家族の名前）がありません</b>。「ウィンウィンテー」のように、全部で1つの名前です。"],

];
const $=s=>document.querySelector(s),main=$("#main"),back=$("#back");
let fav=new Set(JSON.parse(localStorage.getItem("mm-fav")||"[]"));
const saveFav=()=>localStorage.setItem("mm-fav",JSON.stringify([...fav]));
const id=w=>w[1]+"|"+w[2];
const esc=s=>s;
function card(w){const f=fav.has(id(w));return`<div class="card"><div class="main"><div class="jp">${w[1]}</div><div class="my mm">${w[2]}</div><div class="kana">${w[3]}</div>${w[4]?`<div class="note">💡 ${w[4]}</div>`:""}</div><button class="fav${f?" on":""}" data-id="${id(w)}">⭐</button></div>`}
function bindFav(){main.querySelectorAll(".fav").forEach(b=>b.onclick=()=>{const k=b.dataset.id;fav.has(k)?fav.delete(k):fav.add(k);saveFav();b.classList.toggle("on")})}
function setTitle(t){$("#ttl").innerHTML=t}
function sub(on){document.body.classList.toggle("sub",on)}
function todays(){const d=new Date();const n=(d.getFullYear()*372+d.getMonth()*31+d.getDate());const pool=W.filter(w=>w[0]!=="num"&&w[0]!=="day");return pool[n%pool.length]}

 const t=todays();
 main.innerHTML=`<div class="hero"><div style="font-size:12px;opacity:.85">☀️ 今日のひとこと</div><div class="big mm">${t[2]}</div><div class="k"><b>${t[3]}</b>　${t[1]}</div>${t[4]?`<div class="t">💡 ${t[4]}</div>`:""}</div>
 <input class="search" id="q" placeholder="🔍 日本語でさがす（例：ありがとう）">
 <div id="res"></div>
 <div class="grid" id="grid">

 </div>`;
 main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));

 q.oninput=()=>{const s=q.value.trim();if(!s){res.innerHTML="";grid.style.display="";return}grid.style.display="none";const h=W.filter(w=>(w[1]+w[3]+w[2]+w[4]).includes(s));res.innerHTML=h.length?h.map(card).join(""):`<div class="empty">見つかりませんでした</div>`;bindFav()};

 else if(r==="fav"){listView("⭐ お気に入り",W.filter(w=>fav.has(id(w))),"まだありません。単語の⭐を押すとここに集まります。")}

}
function listView(title,list,emptyMsg){setTitle(title);let mode="list",i=0,show=false;
 const draw=()=>{const tabs=`<div class="tabs"><button class="${mode==="list"?"on":""}" data-m="list">📋 一覧</button><button class="${mode==="flash"?"on":""}" data-m="flash">🃏 カード</button></div>`;
  if(!list.length){main.innerHTML=`<div class="empty">${emptyMsg||"ありません"}</div>`;return}
  if(mode==="list"){main.innerHTML=tabs+list.map(card).join("");bindFav()}
  else{const w=list[i];main.innerHTML=tabs+`<div class="flash" id="fl">${show?`<div class="my mm">${w[2]}</div><div class="kana">${w[3]}</div><div style="font-size:16px;color:#888;margin-top:8px">${w[1]}</div>${w[4]?`<div class="note" style="margin-top:10px;font-size:13px;color:#8a7d55">💡 ${w[4]}</div>`:""}`:`<div class="jp">${w[1]}</div><div class="hint">ミャンマー語で何と言う？<br>タップして答えを見る</div>`}</div>
   <div class="nav"><button id="pv">← 前へ</button><button class="pri" id="nx">次へ →</button></div><div style="text-align:center;color:#999;font-size:13px;margin-top:8px">${i+1} / ${list.length}</div>`;
   $("#fl").onclick=()=>{show=!show;draw()};$("#pv").onclick=()=>{i=(i-1+list.length)%list.length;show=false;draw()};$("#nx").onclick=()=>{i=(i+1)%list.length;show=false;draw()}}
  main.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;i=0;show=false;draw()})};
 draw()}
function quiz(){setTitle("🎯 クイズ");let n=0,ok=0;const pool=W.slice();
 const next=()=>{if(n>=10){const msg=ok>=9?"すばらしい！🎉":ok>=6?"よくできました！👏":"もう一回やってみよう💪";
   main.innerHTML=`<div class="qbox" style="text-align:center"><div style="font-size:60px">${ok>=9?"🏆":ok>=6?"⭐":"🌱"}</div><div class="qq">${ok} / 10 正解</div><div style="font-size:18px">${msg}</div><div class="nav"><button class="pri" id="again">もう一回</button><button id="hm">ホームへ</button></div></div>`;$("#again").onclick=quiz;$("#hm").onclick=()=>history.back();return}
  const w=pool[Math.floor(Math.random()*pool.length)];const rev=Math.random()<.5;
  const others=W.filter(x=>x!==w&&x[0]===w[0]).sort(()=>Math.random()-.5).slice(0,3);
  while(others.length<3){const x=W[Math.floor(Math.random()*W.length)];if(x!==w&&!others.includes(x))others.push(x)}
  const opts=[w,...others].sort(()=>Math.random()-.5);
  main.innerHTML=`<div class="score"><span>第${n+1}問 / 10</span><span>正解 ${ok}</span></div><div class="qbox"><div class="qt">${rev?"この言葉の意味は？":"ミャンマー語で何と言う？"}</div><div class="qq ${rev?"mm":""}">${rev?w[2]+`<div style="font-size:16px;color:#2a9d63">${w[3]}</div>`:w[1]}</div>
   ${opts.map((o,k)=>`<button class="opt" data-k="${k}">${rev?o[1]:`<span class="mm">${o[2]}</span><small>${o[3]}</small>`}</button>`).join("")}</div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(main.querySelector(".opt.ok"))return;const pick=opts[+b.dataset.k];main.querySelectorAll(".opt").forEach((x,k)=>{if(opts[k]===w)x.classList.add("ok")});if(pick===w)ok++;else b.classList.add("ng");n++;setTimeout(next,pick===w?700:1500)})};
 next()}
back.onclick=()=>history.back();
window.onpopstate=e=>{e.state&&e.state.r?route(e.state.r):home()};
home();
</script>
