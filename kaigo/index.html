nav.modes{display:flex;gap:6px;margin:12px 0 0;border-bottom:1px solid var(--line)}
nav.modes button{flex:1;border:0;background:none;padding:10px 0 9px;font:inherit;font-size:14px;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer}
nav.modes button.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:0 16px 40px;max-width:640px;margin:0 auto}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--card);margin-bottom:10px}
.count{font-size:12px;color:var(--sub);margin:0 2px 8px}
.item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 1px 0 var(--line)}
.item .body{flex:1;min-width:0}
.jp{font-size:18px;font-weight:700}
.kana{font-size:12px;color:var(--sub)}
.item .mm{font-size:15px;margin-top:4px}
.icon{border:0;background:none;font-size:20px;padding:4px;cursor:pointer;line-height:1;color:var(--sub)}
.icon.fav{color:#e0a400}
.empty{text-align:center;color:var(--sub);padding:40px 0}
/* flashcard */
.flash{perspective:1000px;margin:8px 0 14px}
.fcard{position:relative;height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;backface-visibility:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .jp{font-size:30px}
.face .kana{font-size:15px;margin-top:6px}
.face .mm{font-size:22px}
.hint{font-size:12px;color:var(--sub);margin-top:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:10px;padding:12px 14px;font:inherit;font-size:14px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.prog{text-align:center;font-size:13px;color:var(--sub)}
.toggle{display:flex;gap:6px;margin:6px 0 4px}
.toggle .chip{font-size:12px}
/* quiz */
.q{background:var(--card);border-radius:16px;padding:22px 16px;text-align:center;margin:8px 0 12px}
.q .jp{font-size:26px}
.q .mm{font-size:20px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:#e5f3ea}
.opt.ng{border-color:var(--ng);background:#fbe6e3}
.score{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:6px}
.result{text-align:center;padding:30px 10px}
.result .big{font-size:44px;font-weight:700;color:var(--accent)}
footer{font-size:11px;color:var(--sub);text-align:center;padding:10px 16px 30px}

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let jaVoice=null;
function pickVoice(){ try{ jaVoice=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja"))||null }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function speak(t){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=.85; if(jaVoice)u.voice=jaVoice; speechSynthesis.speak(u);}catch(e){}
}

function words(){
  let w = cat==="all"?W : cat==="fav"?W.filter(x=>favs.has(x.id)) : W.filter(x=>x.cat===cat);
  if(q && mode==="list"){ const s=q.toLowerCase(); w=w.filter(x=>x.jp.includes(q)||x.kana.includes(q)||x.mm.includes(q)||x.jp.toLowerCase().includes(s)); }
  return w;
}

  <div class="count">${w.length} 語</div>
  ${w.length? w.map(x=>`<div class="item">
     <div class="body"><div class="jp">${x.jp}</div>${x.kana!==x.jp?`<div class="kana">${x.kana}</div>`:""}<div class="mm">${x.mm}</div></div>
     <button class="icon" data-say="${x.id}" aria-label="発音">🔊</button>
     <button class="icon ${favs.has(x.id)?"fav":""}" data-fav="${x.id}" aria-label="お気に入り">${favs.has(x.id)?"★":"☆"}</button>
   </div>`).join("") : `<div class="empty">${cat==="fav"?"☆ を押してお気に入りに追加<br><span class='mm'>☆ နှိပ်ပြီး သိမ်းထားပါ</span>":"見つかりません"}</div>`}`;
  const s=$("#search");
  s.oninput=e=>{q=e.target.value; const pos=s.selectionStart; renderList(); const n=$("#search"); n.focus(); n.setSelectionRange(pos,pos);};
}

function startCards(){ cardOrder=shuffle(words()); cardIdx=0; }
function renderCard(){
  if(!cardOrder.length){ $("#main").innerHTML=`<div class="empty">単語がありません</div>`; return; }
  const x=cardOrder[cardIdx];
  const jpFace=`<div class="jp">${x.jp}</div>${x.kana!==x.jp?`<div class="kana">${x.kana}</div>`:""}`;
  const mmFace=`<div class="mm">${x.mm}</div>`;
  $("#main").innerHTML=`
  <div class="toggle">
    <button class="chip ${cardDir==="jp"?"on":""}" data-dir="jp">日本語 → မြန်မာ</button>
    <button class="chip ${cardDir==="mm"?"on":""}" data-dir="mm">မြန်မာ → 日本語</button>
  </div>
  <div class="flash"><div class="fcard" id="fcard">
    <div class="face">${cardDir==="jp"?jpFace:mmFace}<div class="hint">タップでめくる ・ <span class="mm">နှိပ်ပြီး လှန်ပါ</span></div></div>
    <div class="face back">${cardDir==="jp"?mmFace:jpFace}</div>
  </div></div>
  <div class="row">
    <button class="btn" id="prev" ${cardIdx===0?"disabled":""}>◀ 前</button>
    <button class="btn" data-say="${x.id}">🔊</button>
    <button class="btn ${favs.has(x.id)?"":""}" data-fav="${x.id}">${favs.has(x.id)?"★":"☆"}</button>
    <button class="btn primary" id="next">${cardIdx===cardOrder.length-1?"もう一度":"次 ▶"}</button>
  </div>
  <p class="prog">${cardIdx+1} / ${cardOrder.length}</p>`;
  $("#fcard").onclick=()=>$("#fcard").classList.toggle("flip");
  $("#prev").onclick=()=>{cardIdx--;renderCard()};
  $("#next").onclick=()=>{ if(cardIdx===cardOrder.length-1){startCards()}else cardIdx++; renderCard(); };
}

function startQuiz(){
  const pool=words();
  const qs=shuffle(pool).slice(0,10);
  quiz={qs, i:0, score:0, answered:false, opts:null, pool};
}
function makeOpts(x){
  const base = quiz.pool.length>=4 ? quiz.pool : W;
  let others=shuffle(base.filter(y=>y.id!==x.id && y.cat===x.cat));
  if(others.length<3) others=others.concat(shuffle(W.filter(y=>y.id!==x.id && !others.includes(y))));
  return shuffle([x,...others.slice(0,3)]);
}
function renderQuiz(){
  if(!quiz) startQuiz();
  if(quiz.qs.length<1){ $("#main").innerHTML=`<div class="empty">単語がありません</div>`; return; }
  if(quiz.i>=quiz.qs.length){
    const pct=Math.round(quiz.score/quiz.qs.length*100);
    $("#main").innerHTML=`<div class="result"><div class="big">${quiz.score} / ${quiz.qs.length}</div>
      <p>${pct===100?"満点！すばらしい！🎉":pct>=70?"よくできました！👏":"もう一度がんばりましょう💪"}</p>
      <p class="mm">${pct===100?"အမှတ်ပြည့်! အရမ်းတော်တယ်!":pct>=70?"တော်တယ်!":"နောက်တစ်ခါ ထပ်ကြိုးစားကြရအောင်"}</p>
      <button class="btn primary" id="again">もう一度 ・ <span class="mm">ထပ်ဖြေမယ်</span></button></div>`;
    $("#again").onclick=()=>{startQuiz();renderQuiz()};
    return;
  }
  const x=quiz.qs[quiz.i];
  if(!quiz.opts) quiz.opts=makeOpts(x);
  const qHtml = quizDir==="jp" ? `<div class="jp">${x.jp}</div>${x.kana!==x.jp?`<div class="kana">${x.kana}</div>`:""}` : `<div class="mm">${x.mm}</div>`;
  $("#main").innerHTML=`
  <div class="toggle">
    <button class="chip ${quizDir==="jp"?"on":""}" data-qdir="jp">日本語 → မြန်မာ</button>
    <button class="chip ${quizDir==="mm"?"on":""}" data-qdir="mm">မြန်မာ → 日本語</button>
  </div>
  <div class="q">${qHtml}${quizDir==="jp"?`<div><button class="icon" data-say="${x.id}">🔊</button></div>`:""}</div>
  <div class="opts">${quiz.opts.map(o=>`<button class="opt ${quizDir==="jp"?"mm":""}" data-ans="${o.id}">${quizDir==="jp"?o.mm:`${o.jp}${o.kana!==o.jp?` <span class="kana">（${o.kana}）</span>`:""}`}</button>`).join("")}</div>
  <div class="score"><span>${quiz.i+1} / ${quiz.qs.length}</span><span>正解 ${quiz.score}</span></div>
  <div id="nextwrap" style="margin-top:12px"></div>`;
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{
    if(quiz.answered) return; quiz.answered=true;
    const ok=+b.dataset.ans===x.id; if(ok) quiz.score++;
    document.querySelectorAll("[data-ans]").forEach(c=>{ if(+c.dataset.ans===x.id)c.classList.add("ok"); else if(c===b)c.classList.add("ng"); });
    speak(x.kana);
    $("#nextwrap").innerHTML=`<button class="btn primary" style="width:100%" id="qnext">${quiz.i===quiz.qs.length-1?"結果を見る":"次へ ▶"}</button>`;
    $("#qnext").onclick=()=>{quiz.i++;quiz.answered=false;quiz.opts=null;renderQuiz()};
  });
}

function render(){
  renderChips();
  if(mode==="list") renderList();
  else if(mode==="card") renderCard();
  else renderQuiz();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.mode){ mode=t.dataset.mode; document.querySelectorAll("nav.modes button").forEach(b=>b.classList.toggle("on",b===t)); if(mode==="card")startCards(); if(mode==="quiz")startQuiz(); render(); window.scrollTo(0,0); }
  else if(t.dataset.cat){ cat=t.dataset.cat; if(mode==="card")startCards(); if(mode==="quiz")startQuiz(); render(); }
  else if(t.dataset.say!==undefined){ e.stopPropagation(); const x=W[+t.dataset.say]; speak(x.kana); }
  else if(t.dataset.fav!==undefined){ const id=+t.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); saveFav(); render(); }
  else if(t.dataset.dir){ cardDir=t.dataset.dir; renderCard(); }
  else if(t.dataset.qdir){ quizDir=t.dataset.qdir; quiz.opts=null; renderQuiz(); }
});
render();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/win/sw.js").catch(()=>{})</script>
</body>
