<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Win タッチであそぼ</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タッチであそぼ">
<meta name="theme-color" content="#ffe9a8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Noto+Sans+Myanmar:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:#fff6dc;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;color:#5a4636;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 18px;min-height:100%;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{border:0;border-radius:18px;background:#fff;font-size:30px;padding:8px 0 4px;box-shadow:0 3px 0 #f0dcb0;font-family:inherit;color:inherit}
.tab small{display:block;font-size:11px;margin-top:2px}
.tab.on{background:#ffcf5a;box-shadow:0 3px 0 #e3a92a}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:170px;padding:6px 0}
.big .emo{font-size:86px;line-height:1;transition:transform .15s}
.big .emo.boing{animation:boing .5s}
.big .name{font-size:30px;margin-top:6px;min-height:40px}
.big .mm{font-family:"Noto Sans Myanmar","Myanmar Text",sans-serif;font-size:20px;color:#8a7360;min-height:30px}
.big .en{font-size:18px;color:#8a7360;min-height:24px}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}60%{transform:scale(.9) rotate(6deg)}100%{transform:scale(1)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{border:0;border-radius:22px;background:#fff;aspect-ratio:1;font-size:46px;box-shadow:0 4px 0 #f0dcb0;display:flex;align-items:center;justify-content:center;padding:0}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #f0dcb0}
.dot{width:70%;height:70%;border-radius:50%}
.lang{display:flex;justify-content:center;gap:6px;margin-top:12px}
.lang button{border:0;border-radius:999px;background:#fff;padding:6px 14px;font-family:inherit;font-size:13px;color:inherit;box-shadow:0 2px 0 #f0dcb0}
.lang button.on{background:#5a4636;color:#fff}
#play{position:relative;flex:1;min-height:420px;border-radius:24px;background:#fff;overflow:hidden;box-shadow:0 4px 0 #f0dcb0;touch-action:none;margin-top:10px}
#play .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#c9b391;pointer-events:none;text-align:center;line-height:1.6}
.pop{position:absolute;border-radius:50%;pointer-events:none;animation:pop 1.1s ease-out forwards;display:flex;align-items:center;justify-content:center}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}70%{opacity:.95}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="stage"></div>
  <div class="lang" id="lang"></div>
</div>
<script>
const SETS={
 animal:{icon:"🐶",jp:"どうぶつ",items:[
  ["🐶","いぬ","わんわん","ခွေး","Dog","Woof woof"],["🐱","ねこ","にゃーにゃー","ကြောင်","Cat","Meow"],
  ["🐮","うし","もーもー","နွား","Cow","Moo"],["🐷","ぶた","ぶーぶー","ဝက်","Pig","Oink oink"],
  ["🐤","ひよこ","ぴよぴよ","ကြက်ကလေး","Chick","Cheep cheep"],["🐸","かえる","けろけろ","ဖား","Frog","Ribbit"],
  ["🐘","ぞう","ぱおーん","ဆင်","Elephant","Toot"],["🦁","らいおん","がおー","ခြင်္သေ့","Lion","Roar"],
  ["🐑","ひつじ","めぇー","သိုး","Sheep","Baa"],["🐴","うま","ひひーん","မြင်း","Horse","Neigh"],
  ["🦆","あひる","があがあ","ဘဲ","Duck","Quack quack"],["🐵","さる","うきき","မျောက်","Monkey","Ooh ooh"]]},
 car:{icon:"🚗",jp:"のりもの",items:[
  ["🚗","くるま","ぶっぶー","ကား","Car","Beep beep"],["🚃","でんしゃ","がたんごとん","ရထား","Train","Choo choo"],
  ["🚒","しょうぼうしゃ","うーうー","မီးသတ်ကား","Fire truck","Wee woo"],["🚑","きゅうきゅうしゃ","ぴーぽーぴーぽー","လူနာတင်ကား","Ambulance","Wee woo"],
  ["✈️","ひこうき","ぶーん","လေယာဉ်","Airplane","Zoom"],["🚢","ふね","ぽーっ","သင်္ဘော","Ship","Toot toot"],
  ["🚌","ばす","ぶーぶー","ဘတ်စ်ကား","Bus","Beep"],["🚓","ぱとかー","うーうー","ရဲကား","Police car","Wee woo"],
  ["🚲","じてんしゃ","ちりんちりん","စက်ဘီး","Bicycle","Ring ring"],["🚁","へりこぷたー","ばらばらばら","ရဟတ်ယာဉ်","Helicopter","Whirr"],
  ["🚜","とらくたー","どこどこ","ထွန်စက်","Tractor","Rumble"],["🚀","ろけっと","びゅーん","ဒုံးပျံ","Rocket","Whoosh"]]},
 fruit:{icon:"🍎",jp:"たべもの",items:[
  ["🍎","りんご","しゃりしゃり","ပန်းသီး","Apple","Crunch"],["🍌","ばなな","もぐもぐ","ငှက်ပျောသီး","Banana","Yum"],
  ["🍓","いちご","あまーい","စတော်ဘယ်ရီ","Strawberry","Sweet"],["🍇","ぶどう","ころころ","စပျစ်သီး","Grapes","Yum yum"],
  ["🍊","みかん","すっぱい","လိမ္မော်သီး","Orange","Juicy"],["🍉","すいか","しゃくしゃく","ဖရဲသီး","Watermelon","Crunch"],
  ["🍑","もも","ふわふわ","မက်မွန်သီး","Peach","Soft"],["🍈","めろん","じゅわー","သခွားမွှေးသီး","Melon","Juicy"],
  ["🍞","ぱん","ふわふわ","ပေါင်မုန့်","Bread","Fluffy"],["🍙","おにぎり","もぐもぐ","ထမင်းလုံး","Rice ball","Yum"],
  ["🥛","ぎゅうにゅう","ごくごく","နွားနို့","Milk","Gulp"],["🍰","けーき","おいしいね","ကိတ်မုန့်","Cake","Yummy"]]},
 color:{icon:"🎨",jp:"いろ",items:[
  ["#ef4444","あか","","အနီ","Red",""],["#3b82f6","あお","","အပြာ","Blue",""],
  ["#facc15","きいろ","","အဝါ","Yellow",""],["#22c55e","みどり","","အစိမ်း","Green",""],
  ["#f472b6","ぴんく","","ပန်းရောင်","Pink",""],["#fb923c","おれんじ","","လိမ္မော်ရောင်","Orange",""],
  ["#a855f7","むらさき","","ခရမ်းရောင်","Purple",""],["#92400e","ちゃいろ","","အညို","Brown",""],
  ["#111827","くろ","","အနက်","Black",""],["#ffffff","しろ","","အဖြူ","White",""],
  ["#9ca3af","はいいろ","","မီးခိုးရောင်","Gray",""],["#06b6d4","みずいろ","","အပြာနု","Light blue",""]]},
 play:{icon:"🫧",jp:"ぽんぽん"}
};
const ORDER=["animal","car","fruit","color","play"];
let mode="animal",lang="ja",sel=null;
try{lang=localStorage.getItem("baby-lang")||"ja"}catch(e){}

let ac=null;
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(f,t,d,v,type="sine"){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function chime(){if(!audio())return;const t=ac.currentTime;[0,4,7].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),t+i*.07,.5,.12,"triangle"))}
const PENTA=[0,2,4,7,9,12,14,16];
function note(i){if(!audio())return;tone(392*Math.pow(2,PENTA[i%PENTA.length]/12),ac.currentTime,.7,.15,"triangle")}
function speak(text,l){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=l;u.rate=l==="ja-JP"?.8:.85;u.pitch=1.3;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith(l.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}

function renderTabs(){
  document.getElementById("tabs").innerHTML=ORDER.map(k=>`<button class="tab ${k===mode?"on":""}" data-mode="${k}">${SETS[k].icon}<small>${SETS[k].jp}</small></button>`).join("");
  document.getElementById("lang").innerHTML=[["ja","にほんご"],["en","English"],["mm","မြန်မာ"]].map(([k,v])=>`<button class="${k===lang?"on":""}" data-lang="${k}">${v}</button>`).join("");
}
function face(it){return mode==="color"?`<span class="dot" style="background:${it[0]};${it[0]==="#ffffff"?"box-shadow:inset 0 0 0 2px #e5d6bd":""}"></span>`:it[0]}
function render(){
  renderTabs();
  const st=document.getElementById("stage");
  if(mode==="play"){
    st.innerHTML=`<div id="play"><div class="hint">さわってみてね<br>👆</div></div>`;bindPlay();return;
  }
  const items=SETS[mode].items;const it=sel!=null?items[sel]:null;
  st.innerHTML=`<div class="big"><div class="emo" id="emo">${it?(mode==="color"?`<span style="display:inline-block;width:90px;height:90px;border-radius:50%;background:${it[0]};${it[0]==="#ffffff"?"box-shadow:inset 0 0 0 3px #e5d6bd":""}"></span>`:it[0]):"👇"}</div>
   <div class="name">${it?(lang==="en"?it[4]:it[1]):"どれかな？"}</div>
   <div class="en">${it&&it[2]&&lang!=="en"?it[2]:(it&&lang==="en"&&it[5]?it[5]:"")}</div>
   <div class="mm">${it?it[3]:""}</div></div>
   <div class="grid">${items.map((x,i)=>`<button class="card" data-i="${i}" aria-label="${x[1]}">${face(x)}</button>`).join("")}</div>`;
}
function tap(i){
  sel=i;render();chime();
  const it=SETS[mode].items[i];
  const e=document.getElementById("emo");e.classList.remove("boing");void e.offsetWidth;e.classList.add("boing");
  setTimeout(()=>{
    if(lang==="en")speak(it[4]+(it[5]?"! "+it[5]:""),"en-US");
    else speak(it[1]+(it[2]?"、"+it[2]:""),"ja-JP");
  },250);
}
const POPC=["#ff8fa3","#ffd166","#06d6a0","#4cc9f0","#b388eb","#ff9f1c"];
const POPE=["⭐","💖","🌸","🫧","🌈","✨","🎵","🍭"];
let pi=0;
function bindPlay(){
  const pl=document.getElementById("play");
  pl.addEventListener("pointerdown",e=>{
    e.preventDefault();const r=pl.getBoundingClientRect();
    const hint=pl.querySelector(".hint");if(hint)hint.remove();
    const d=document.createElement("div");d.className="pop";const s=70+Math.random()*60;
    d.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;width:${s}px;height:${s}px;background:${POPC[pi%POPC.length]};font-size:${s*.5}px`;
    d.textContent=POPE[Math.random()*POPE.length|0];
    pl.appendChild(d);setTimeout(()=>d.remove(),1150);note(pi);pi++;
  });
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.mode){mode=b.dataset.mode;sel=null;audio();render()}
  else if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem("baby-lang",lang)}catch(e){}render();if(sel!=null)tap(sel)}
  else if(b.dataset.i!=null)tap(+b.dataset.i);
});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
render();
</script>
</body>
</html>
