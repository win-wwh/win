.bnav button{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px}
.bnav button b{font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.6}
.bnav button.on{color:var(--accent);font-weight:700}
.bnav button.on b{filter:none;opacity:1}

.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:#ffffff1a}
.hero .t{font-size:13px;opacity:.9}
.hero .big{font-size:30px;font-weight:900;margin:2px 0}
.hero .big small{font-size:15px;font-weight:700;opacity:.9}

.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hero .row3 div{background:#ffffff26;border-radius:14px;padding:8px 4px;text-align:center;font-size:11px}
.hero .row3 b{display:block;font-size:20px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sec h2{font-size:16px;margin:0}
.sec span{font-size:12px;color:var(--sub)}
.today{background:var(--card);border-radius:18px;padding:6px 14px;box-shadow:0 2px 10px #0000000a}
.today .w{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.today .w:last-child{border:0}
.today .w .b{flex:1;min-width:0}
.today .w .jp{font-size:17px;font-weight:700}
.today .w .k{font-size:11px;color:var(--sub)}
.today .w .mm{font-size:13px;color:#4c443d}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;border-radius:18px;padding:14px;text-align:left;font:inherit;background:var(--card);box-shadow:0 2px 10px #0000000a;color:var(--ink)}
.act b{display:block;font-size:24px;margin-bottom:4px}
.act span{font-size:14px;font-weight:700}
.act small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:0;border-radius:18px;padding:12px;text-align:left;font:inherit;color:var(--ink);position:relative}
.cat .e{font-size:26px}
.cat .n{font-size:14px;font-weight:700;margin-top:2px}
.cat .m{font-size:11px;color:#5d544c;line-height:1.6}
.cat .p{height:6px;border-radius:4px;background:#ffffff99;margin-top:8px;overflow:hidden}
.cat .p i{display:block;height:100%;background:#2b262299;border-radius:4px}
.cat .c{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;color:#5d544c}

.count{font-size:12px;color:var(--sub);margin:0 2px 8px;display:flex;justify-content:space-between}

.item.done{background:#f1f8f3}
.item .body{flex:1;min-width:0}
.jp{font-size:18px;font-weight:700}
.kana{font-size:12px;color:var(--sub)}

.icon.lr.on{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.9}

.toggle .chip{font-size:12px}
.flash{perspective:1000px;margin:8px 0 12px}
.fcard{position:relative;height:270px;transition:transform .45s;transform-style:preserve-3d}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 20px #0000000f}

.face .kana{font-size:16px;margin-top:6px}
.face .mm{font-size:22px}

.hint{font-size:12px;color:var(--sub);margin-top:14px}
.row{display:flex;gap:8px;align-items:center}

.btn.ok{background:var(--ok);color:#fff}
.btn.again{background:#fff3e0;color:#b45309}
.btn:disabled{opacity:.35}
.prog{text-align:center;font-size:13px;color:var(--sub);margin-top:10px}
.pbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 0}
.pbar i{display:block;height:100%;background:var(--accent)}

.q .mm{font-size:20px}

.opt.ok{border-color:var(--ok);background:#e5f3ea}
.opt.ng{border-color:var(--ng);background:#fbe6e3}
.score{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:8px}
.result{text-align:center;padding:24px 6px}
.result .big{font-size:48px;font-weight:900;color:var(--accent)}
.miss{background:var(--card);border-radius:16px;padding:6px 14px;text-align:left;margin:14px 0}
.miss div{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.miss div:last-child{border:0}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#2b2622ee;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
footer{font-size:11px;color:var(--sub);text-align:center;padding:16px 0 0;line-height:1.8}
</style>
</head>

  <div class="score"><span>${quiz.i+1} / ${quiz.qs.length}</span><span>正解 ${quiz.score}</span></div><div id="nextwrap" style="margin-top:12px"></div>`;
 document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{if(quiz.answered)return;quiz.answered=true;
  const ok=+b.dataset.ans===x.id;touch(x.id);
  if(ok){quiz.score++;if(weak[x.id]){weak[x.id]--;if(weak[x.id]<=0)delete weak[x.id]}}else{weak[x.id]=(weak[x.id]||0)+1;quiz.miss.push(x)}saveWeak();
  document.querySelectorAll("[data-ans]").forEach(c=>{if(+c.dataset.ans===x.id)c.classList.add("ok");else if(c===b)c.classList.add("ng")});
  speak(x.kana);
  $("#nextwrap").innerHTML=`${!ok&&quizDir!=="jp"?`<div style="text-align:center;font-size:13px;margin-bottom:8px">${x.jp}（${x.kana}）＝ <span class="mm">${x.mm}</span></div>`:""}<button class="btn primary" style="width:100%" id="qnext">${quiz.i===quiz.qs.length-1?"結果を見る":"次へ ▶"}</button>`;
  $("#qnext").onclick=()=>{quiz.i++;quiz.answered=false;quiz.opts=null;renderQuiz()}})}

// ---------- 国家試験
let kkRes=LS("kaigo-kk",{}),kk=null;
const saveKK=()=>SV("kaigo-kk",kkRes);
function kkStart(list,title){kk={qs:list,i:0,score:0,ans:null,title,miss:[]};renderKK()}
function renderKK(){const G=window.KK_GROUPS||[],Q=window.KK||[];
 if(!kk){const done=Object.keys(kkRes).length,ok=Object.values(kkRes).filter(v=>v===1).length;
  $("#main").innerHTML=`<div class="hero" style="background:linear-gradient(135deg,#3b5bdb,#5c7cfa);box-shadow:0 10px 24px #3b5bdb33"><div class="t">🎓 介護福祉士 国家試験 練習 <span class="mm">အမျိုးသား စာမေးပွဲ လေ့ကျင့်ခန်း</span></div>
   <div class="big">${ok} <small>/ ${Q.length} 問 正解</small></div><div class="bar"><i style="width:${Q.length?ok/Q.length*100:0}%"></i></div>
   <div style="font-size:12px;line-height:1.7;position:relative;z-index:1">2025年（第37回）の試験：125問・5つから1つ選ぶ<br>合格ライン：70点以上 ＋ 11の科目群すべてで1問以上正解<br>※第37回から実技試験はありません</div></div>
   <div class="acts"><button class="act" id="kkRand"><b>🎲</b><span>ランダム10問</span><small>いろいろな科目から</small></button>
   <button class="act" id="kkAll"><b>📋</b><span>模擬テスト</span><small>本番と同じ${Q.length}問・合格ライン70点</small></button>
   <button class="act" id="kkMiss"><b>❗</b><span>まちがえた問題</span><small>${Object.values(kkRes).filter(v=>v===0).length}問</small></button>
   <button class="act" id="kkNew"><b>🆕</b><span>まだ解いていない</span><small>${Q.length-done}問</small></button></div>
   <div class="sec"><h2>📚 11の科目群</h2><span>正解 / 問題数</span></div>
   <div class="cats" style="grid-template-columns:1fr">${G.map(g=>{const qs=Q.filter(x=>x.g===g.g),o=qs.filter(x=>kkRes[Q.indexOf(x)]===1).length;
    return`<button class="cat" style="background:#fff;box-shadow:0 2px 10px #0000000a;display:flex;gap:10px;align-items:center" data-kkg="${g.g}"><div class="e">${g.e}</div><div style="flex:1;min-width:0"><div class="n">${g.g}. ${g.jp}</div><div class="m mm">${g.mm}</div><div class="p" style="background:#eef1fb"><i style="width:${qs.length?o/qs.length*100:0}%;background:#3b5bdb"></i></div></div><span style="font-size:12px;font-weight:700;color:#5d544c">${o}/${qs.length}</span></button>`}).join("")}</div>
   <footer>📝 これは本物の試験問題ではありません。2025年（第37回）の出題範囲（11科目群）に合わせて作った<b>オリジナルの練習問題</b>です。<br>本物の過去の問題と正答は、<a href="https://www.sssc.or.jp/" target="_blank" rel="noopener">社会福祉振興・試験センター</a>のホームページで見られます。<br>${done?`<button class="chip" id="kkReset" style="margin-top:8px">記録をリセット</button>`:""}</footer>`;
  const idx=Q.map((x,i)=>i);
  $("#kkRand").onclick=()=>kkStart(shuffle(idx).slice(0,10),"ランダム10問");
  $("#kkAll").onclick=()=>kkStart(shuffle(idx),"模擬テスト");
  $("#kkMiss").onclick=()=>{const m=idx.filter(i=>kkRes[i]===0);if(!m.length){toast("まちがえた問題はありません 👏");return}kkStart(shuffle(m),"まちがえた問題")};
  $("#kkNew").onclick=()=>{const m=idx.filter(i=>kkRes[i]===undefined);if(!m.length){toast("全部解きました 🎉");return}kkStart(shuffle(m).slice(0,10),"まだ解いていない問題")};
  document.querySelectorAll("[data-kkg]").forEach(b=>b.onclick=()=>{const g=+b.dataset.kkg;kkStart(idx.filter(i=>Q[i].g===g),G.find(x=>x.g===g).jp)});
  const rs=$("#kkReset");if(rs)rs.onclick=()=>{if(confirm("国家試験の記録をリセットしますか？")){kkRes={};saveKK();renderKK()}};return}
 if(kk.i>=kk.qs.length){const pct=Math.round(kk.score/kk.qs.length*100),full=kk.qs.length===(window.KK||[]).length,gs=new Set(kk.qs.filter(i=>kkRes[i]===1&&!kk.miss.includes(i)).map(i=>Q[i].g)),pass=full?(kk.score>=70&&gs.size===G.length):pct>=56;
  $("#main").innerHTML=`<div class="result"><div style="font-size:13px;color:var(--sub)">${esc(kk.title)}</div><div class="big">${kk.score} / ${kk.qs.length}</div><p style="font-size:18px;font-weight:700">${full?(pass?"🎉 合格ライン（70点＋全科目群で得点）クリア！":`💪 もう少し！（合格ライン70点・正解した科目群 ${gs.size}/${G.length}）`):`${pct}% ${pass?"🎉 合格ライン（約56%）こえ！":"💪 もう少し！合格ラインは約56%"}`}</p>
   ${kk.miss.length?`<div class="miss"><b style="font-size:13px;display:block;padding-top:6px">❗ まちがえた問題</b>${kk.miss.map(i=>{const x=Q[i];return`<div><span style="font-size:11px;color:var(--sub)">${G.find(g=>g.g===x.g).jp}</span><br>${esc(x.q)}<br><b style="color:var(--ok)">正解：${esc(x.o[x.a-1])}</b></div>`}).join("")}</div>`:""}
   <button class="btn primary" id="kkBack" style="width:100%">🎓 国家試験のトップへ</button></div>`;
  if(pass)confetti();$("#kkBack").onclick=()=>{kk=null;renderKK();scrollTo(0,0)};return}
 const i=kk.qs[kk.i],x=Q[i],g=G.find(y=>y.g===x.g);if(!kk.perm)kk.perm=shuffle([0,1,2,3,4]);const P=kk.perm,ca=P.indexOf(x.a-1)+1;
 $("#main").innerHTML=`<div class="row" style="justify-content:space-between;margin:2px 0 6px"><button class="chip" id="kkQuit">✕ やめる</button><span style="font-size:13px;color:var(--sub)">${kk.i+1} / ${kk.qs.length}　正解 ${kk.score}</span></div>
  <div class="pbar"><i style="width:${kk.i/kk.qs.length*100}%;background:#3b5bdb"></i></div>
  <div class="q" style="text-align:left"><div class="ask">${g.e} ${g.g}. ${g.jp}</div><div style="font-size:16px;line-height:1.75;font-weight:700">${esc(x.q)}</div></div>
  <div class="opts">${P.map((k,j)=>`<button class="opt" data-kka="${j+1}"><b style="color:#3b5bdb">${j+1}</b>　${esc(x.o[k])}</button>`).join("")}</div>
  <div id="kkExp" style="margin-top:12px"></div>`;
 $("#kkQuit").onclick=()=>{kk=null;renderKK()};
 document.querySelectorAll("[data-kka]").forEach(b=>b.onclick=()=>{if(kk.ans)return;const a=+b.dataset.kka;kk.ans=a;const ok=a===ca;
  if(ok)kk.score++;else kk.miss.push(i);kkRes[i]=ok?1:0;saveKK();
  document.querySelectorAll("[data-kka]").forEach(c=>{const n=+c.dataset.kka;if(n===ca)c.classList.add("ok");else if(n===a)c.classList.add("ng")});
  $("#kkExp").innerHTML=`<div style="background:${ok?"#e5f3ea":"#fbe6e3"};border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.75"><b>${ok?"⭕ 正解！":"❌ ざんねん"}　正解は ${ca}. ${esc(x.o[x.a-1])}</b><br>💡 ${esc(x.e)}</div>
   <button class="btn primary" id="kkNext" style="width:100%;margin-top:10px">${kk.i===kk.qs.length-1?"結果を見る":"次へ ▶"}</button>`;
  $("#kkNext").onclick=()=>{kk.i++;kk.ans=null;kk.perm=null;renderKK();scrollTo(0,0)};$("#kkExp").scrollIntoView({behavior:"smooth",block:"nearest"})})}

function render(){renderChips();if(mode==="kk"){renderKK();return}if(mode==="home")renderHome();else if(mode==="list")renderList();else if(mode==="card")renderCard();else renderQuiz()}
function setMode(m,keep){mode=m;document.querySelectorAll(".bnav button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
 if(m==="kk")kk=null;if(m==="card"&&!keep)startCards();if(m==="quiz")startQuiz();render();window.scrollTo(0,0)}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.mode){setMode(t.dataset.mode)}
 else if(t.dataset.go){const g=t.dataset.go;if(g==="weak"||g==="fav"){cat=g;setMode(g==="weak"?"quiz":"list")}else{cat="all";setMode(g)}}
 else if(t.dataset.opencat){cat=t.dataset.opencat;setMode("list")}
 else if(t.dataset.goal){st.goal=+t.dataset.goal;saveSt();renderHome()}
 else if(t.dataset.cat){cat=t.dataset.cat;if(mode==="card")startCards();if(mode==="quiz")startQuiz();render()}
 else if(t.dataset.say!==undefined){e.stopPropagation();const x=W[+t.dataset.say];speak(x.kana)}
 else if(t.dataset.fav!==undefined){const id=+t.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);saveFav();render()}
 else if(t.dataset.lr!==undefined){const id=+t.dataset.lr;if(learned.has(id))learned.delete(id);else{learned.add(id);touch(id)}saveLearned();render()}
 else if(t.dataset.dir){cardDir=t.dataset.dir;renderCard()}
 else if(t.dataset.qdir){quizDir=t.dataset.qdir;startQuiz();renderQuiz()}
});
if(location.hash==="#kk")setMode("kk");else if(location.hash==="#card")setMode("card");else render();
</script>
