<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Win アルバム工房</title>
<meta name="description" content="写真を入れるだけで、印刷用のフォトアルバムが作れる。写真はスマホの中だけで作業。PDF・画像で書き出し。">
<meta property="og:type" content="website">
<meta property="og:title" content="Win アルバム工房">
<meta property="og:description" content="写真を入れるだけで、印刷用のフォトアルバムが作れる。">
<meta property="og:image" content="https://win-wwh.github.io/win/album/icon-512.png">
<meta property="og:url" content="https://win-wwh.github.io/win/album/">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アルバム工房">
<meta name="theme-color" content="#b5835a">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#b5835a;--p2:#8c5f3b;--bg:#f6f1ea;--ink:#3a2e25}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:600px;margin:0 auto;padding:10px 12px 100px}
header{display:flex;align-items:center;gap:8px;margin:4px 2px 12px}
header h1{flex:1;margin:0;font-size:19px}
.ib{border:0;background:#fff;border-radius:12px;min-width:40px;height:40px;padding:0 12px;font-size:15px;font-weight:700;color:var(--p2);box-shadow:0 1px 4px #0001;font-family:inherit}
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;background:var(--p);color:#fff;font-family:inherit;box-shadow:0 3px 0 var(--p2)}
.btn.sub{background:#fff;color:var(--p2);box-shadow:0 1px 4px #0002}
.btn.w{width:100%}
.btn.red{background:#fde8e6;color:#b4382b;box-shadow:none}
.alb{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:0 2px 8px #0000000d;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.alb canvas{width:72px;height:72px;border-radius:10px;background:#eee;flex:none}
.alb b{font-size:16px}.alb small{display:block;color:#9a8b7d;font-size:12px;margin-top:2px}
.hero{background:linear-gradient(135deg,#c99a6d,#8c5f3b);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;font-size:13px;line-height:1.7;opacity:.95}
.tools{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.tools button{flex:none}
.tray{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.tray .th{flex:none;width:58px;height:58px;border-radius:10px;background-size:cover;background-position:center;position:relative;border:0}
.tray .th i{position:absolute;right:2px;bottom:2px;background:#000a;color:#fff;font-size:10px;border-radius:6px;padding:0 4px;font-style:normal}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pg{background:none;border:0;padding:0;text-align:center;font:inherit;color:#9a8b7d;font-size:12px}
.pg canvas{width:100%;aspect-ratio:var(--ar);border-radius:6px;box-shadow:0 4px 14px #0000001f;background:#fff;display:block;margin-bottom:4px}
.pg.cover{grid-column:1/-1}.pg.cover canvas{width:70%;margin:0 auto 4px}
.sec{font-size:13px;color:#9a8b7d;font-weight:700;margin:14px 2px 8px}
.empty{background:#fff;border-radius:18px;padding:26px;text-align:center;color:#9a8b7d;line-height:1.8}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);z-index:21;max-width:600px;margin:0 auto;transform:translateY(105%);transition:transform .2s;max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.sheet h2{margin:0 0 10px;font-size:18px}
.lab{font-size:12px;color:#9a8b7d;font-weight:700;margin:12px 0 6px}
input,textarea,select{font:inherit;font-size:16px;border:1.5px solid #e8dfd5;border-radius:12px;padding:10px;width:100%;background:#fff;color:inherit}
.lays{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.lays button{flex:none;width:58px;height:58px;border:2px solid #e8dfd5;border-radius:10px;background:#fff;padding:5px;position:relative}
.lays button.on{border-color:var(--p);background:#fbf3ea}
.lays svg{width:100%;height:100%}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border-radius:10px;border:2px dashed #d9cbbb;background:#faf6f1 center/cover;display:flex;align-items:center;justify-content:center;font-size:22px;color:#c3b2a0;position:relative}
.slot b{position:absolute;left:4px;top:2px;font-size:11px;color:#fff;background:#0008;border-radius:6px;padding:0 5px}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pick button{aspect-ratio:1;border:0;border-radius:8px;background:#eee center/cover;position:relative}
.pick button i{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;font-size:10px;border-radius:6px;padding:0 4px;font-style:normal}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd}
.themes button.on{box-shadow:0 0 0 3px var(--p)}
.row{display:flex;gap:8px}.row>*{flex:1}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#3a2e25ee;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;display:none;text-align:center}
.busy{position:fixed;inset:0;background:#000a;color:#fff;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:16px}
.note{font-size:11px;color:#9a8b7d;text-align:center;line-height:1.7;margin-top:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="file" accept="image/*" multiple style="display:none">
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div style="font-size:40px">📖</div><div id="busyT">処理中…</div></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$("#toast");e.innerHTML=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2000)}
function busy(t){$("#busy").style.display=t?"flex":"none";if(t)$("#busyT").textContent=t}
// ---------- storage
let DB;const dbp=new Promise(r=>{const q=indexedDB.open("album-kobo",1);q.onupgradeneeded=()=>{q.result.createObjectStore("photos");q.result.createObjectStore("meta")};q.onsuccess=()=>{DB=q.result;r(DB)}});
const tx=(st,mode,fn)=>dbp.then(db=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const s=t.objectStore(st);const out=fn(s);t.oncomplete=()=>res(out instanceof IDBRequest?out.result:out);t.onerror=()=>rej(t.error)}));
const putPhoto=(id,v)=>tx("photos","readwrite",s=>s.put(v,id));
const getPhoto=id=>tx("photos","readonly",s=>s.get(id));
const delPhoto=id=>tx("photos","readwrite",s=>s.delete(id));
const saveMeta=()=>tx("meta","readwrite",s=>s.put(ALBUMS,"albums"));
let ALBUMS=[];
// ---------- sizes & themes & layouts
const SIZES={sq:{name:"正方形（20×20cm）",w:1,h:1,mm:[200,200]},a4:{name:"A4 たて",w:210,h:297,mm:[210,297]},a4l:{name:"A4 よこ",w:297,h:210,mm:[297,210]}};
const THEMES={white:{bg:"#ffffff",ink:"#3a2e25",acc:"#b5835a"},cream:{bg:"#f7f0e3",ink:"#4a3a2a",acc:"#b5835a"},pink:{bg:"#fdeef1",ink:"#6b3a47",acc:"#e07a95"},mint:{bg:"#e9f6f1",ink:"#2e4f45",acc:"#3fa58a"},sky:{bg:"#eaf3fc",ink:"#2c3f5c",acc:"#4a88d6"},night:{bg:"#25262e",ink:"#f3efe8",acc:"#e8c27a"}};
// rects in fractions of the content box
const LAYS={
 "1":[[0,0,1,1]],
 "2h":[[0,0,.485,1],[.515,0,.485,1]],
 "2v":[[0,0,1,.485],[0,.515,1,.485]],
 "3":[[0,0,.6,1],[.63,0,.37,.485],[.63,.515,.37,.485]],
 "3t":[[0,0,1,.6],[0,.63,.485,.37],[.515,.63,.485,.37]],
 "4":[[0,0,.485,.485],[.515,0,.485,.485],[0,.515,.485,.485],[.515,.515,.485,.485]],
 "6":[[0,0,.31,.485],[.345,0,.31,.485],[.69,0,.31,.485],[0,.515,.31,.485],[.345,.515,.31,.485],[.69,.515,.31,.485]],
 "1s":[[.1,.05,.8,.8]]
};
const LAYNAME={"1":"1枚","2h":"2枚よこ","2v":"2枚たて","3":"3枚","3t":"3枚（上大）","4":"4枚","6":"6枚","1s":"1枚＋白ふち"};
function laySvg(k){return`<svg viewBox="0 0 10 10">${LAYS[k].map(r=>`<rect x="${r[0]*10}" y="${r[1]*10}" width="${r[2]*10}" height="${r[3]*10}" rx=".4" fill="#c99a6d"/>`).join("")}</svg>`}
// ---------- image cache
const IMG={};
async function img(id){if(!id)return null;if(IMG[id])return IMG[id];const v=await getPhoto(id);if(!v)return null;return IMG[id]=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=URL.createObjectURL(v.blob)})}
function thumbURL(id){const a=cur&&cur.photos.find(p=>p.id===id);return a?a.th:""}
// ---------- rendering
function drawCover(c,im,x,y,w,h){if(!im)return;const r=Math.max(w/im.naturalWidth,h/im.naturalHeight),sw=w/r,sh=h/r;c.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,x,y,w,h)}
function wrapText(c,txt,x,y,maxW,lh,maxLines){const lines=[];for(const para of String(txt).split("\n")){let line="";for(const ch of para){const t=line+ch;if(c.measureText(t).width>maxW&&line){lines.push(line);line=ch}else line=t}lines.push(line)}
 lines.slice(0,maxLines).forEach((l,i)=>c.fillText(l,x,y+i*lh));return Math.min(lines.length,maxLines)}
const fontFam='"Zen Maru Gothic","Noto Sans Myanmar","Hiragino Maru Gothic ProN",sans-serif';
async function renderPage(cv,al,pg,W){const sz=SIZES[al.size],th=THEMES[al.theme];const H=Math.round(W*sz.h/sz.w);cv.width=W;cv.height=H;const c=cv.getContext("2d");
 c.fillStyle=th.bg;c.fillRect(0,0,W,H);const u=W/100;
 if(pg.cover){const m=7*u;const im=await img(pg.slots[0]);const ph=H*.66;
  if(im){c.save();c.beginPath();c.roundRect?c.roundRect(m,m,W-2*m,ph-m,2.5*u):c.rect(m,m,W-2*m,ph-m);c.clip();drawCover(c,im,m,m,W-2*m,ph-m);c.restore()}else{c.fillStyle=th.acc+"33";c.fillRect(m,m,W-2*m,ph-m)}
  c.fillStyle=th.ink;c.textAlign="center";c.textBaseline="alphabetic";c.font=`700 ${7.5*u}px ${fontFam}`;wrapText(c,al.title||"アルバム",W/2,ph+12*u,W-2*m,9*u,2);
  c.font=`500 ${3.8*u}px ${fontFam}`;c.fillStyle=th.acc;wrapText(c,al.sub||"",W/2,H-9*u,W-2*m,5*u,2);
  c.strokeStyle=th.acc;c.lineWidth=.4*u;c.beginPath();c.moveTo(W/2-8*u,ph+16.5*u);c.lineTo(W/2+8*u,ph+16.5*u);c.stroke();return}
 const m=6*u,capH=pg.cap?11*u:0;const bx=m,by=m,bw=W-2*m,bh=H-2*m-capH;
 const rects=LAYS[pg.layout]||LAYS["1"];
 for(let i=0;i<rects.length;i++){const r=rects[i];const x=bx+r[0]*bw,y=by+r[1]*bh,w=r[2]*bw,h=r[3]*bh;const im=await img(pg.slots[i]);
  c.save();c.beginPath();c.roundRect?c.roundRect(x,y,w,h,1.2*u):c.rect(x,y,w,h);c.clip();if(im)drawCover(c,im,x,y,w,h);else{c.fillStyle=th.acc+"22";c.fillRect(x,y,w,h);c.fillStyle=th.acc;c.font=`${6*u}px sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText("＋",x+w/2,y+h/2)}c.restore();
  if(pg.layout==="1s"&&im){c.strokeStyle="#fff";c.lineWidth=1.5*u;c.strokeRect(x,y,w,h)}}
 if(pg.cap){c.fillStyle=th.ink;c.textAlign="center";c.textBaseline="alphabetic";c.font=`500 ${3.6*u}px ${fontFam}`;wrapText(c,pg.cap,W/2,H-m-capH+6*u,bw,4.6*u,2)}}
// ---------- photos
async function shrink(file,max){const url=URL.createObjectURL(file);const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
 const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
 const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.9));const t=document.createElement("canvas");const tk=160/Math.max(cv.width,cv.height);t.width=Math.round(cv.width*tk);t.height=Math.round(cv.height*tk);t.getContext("2d").drawImage(cv,0,0,t.width,t.height);
 return{blob,th:t.toDataURL("image/jpeg",.7)}}
$("#file").onchange=async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length||!cur)return;
 for(let i=0;i<fs.length;i++){busy(`写真を入れています… ${i+1} / ${fs.length}`);try{const r=await shrink(fs[i],2400);const id=uid();await putPhoto(id,{blob:r.blob,album:cur.id});cur.photos.push({id,th:r.th})}catch(err){}}
 busy(false);await saveMeta();toast(`📷 ${fs.length}枚 入れました`);if(cur.pages.length<=1)autoArrange(true);else editor()};
// ---------- auto arrange
function autoArrange(silent){const ids=cur.photos.map(p=>p.id);if(!ids.length){toast("先に写真を入れてください");return}
 const pat=["1s","4","2v","3","2h","3t","4","1","6"];const pages=[{cover:true,slots:[ids[0]]}];let i=1,k=0;
 while(i<ids.length){let lay=pat[k%pat.length];k++;let n=LAYS[lay].length;const rest=ids.length-i;if(n>rest){lay=rest>=4?"4":rest===3?"3":rest===2?"2h":"1"}n=LAYS[lay].length;pages.push({layout:lay,slots:ids.slice(i,i+n),cap:""});i+=n}
 if(ids.length===1)pages.push({layout:"1",slots:[ids[0]],cap:""});
 cur.pages=pages;saveMeta();editor();if(!silent)toast("✨ 自動で並べました");else toast("✨ 自動で並べました<br>ページを押すと変えられます")}
// ---------- screens
let cur=null;
function home(){cur=null;
 $("#app").innerHTML=`<header><h1>📖 アルバム工房</h1></header>
 <div class="hero"><h2>写真を入れるだけで、アルバムに。</h2><p>📷 写真を選ぶ → ✨ 自動で並べる → 📤 印刷用に書き出す<br>🔒 写真はこのスマホの中だけで作業します</p></div>
 <button class="btn w" id="newA">＋ 新しいアルバムを作る</button>
 <div class="sec">わたしのアルバム（${ALBUMS.length}）</div><div id="list"></div>
 <div class="note">お客さんのアルバムを作ったら、書き出したあとに「アルバムを消す」で写真も消せます。</div>`;
 $("#newA").onclick=newAlbum;
 $("#list").innerHTML=ALBUMS.length?ALBUMS.map((a,i)=>`<button class="alb" data-i="${i}"><canvas width="144" height="144"></canvas><div><b>${esc(a.name)}</b><small>📷 ${a.photos.length}枚 ・ 📄 ${a.pages.length}ページ ・ ${SIZES[a.size].name}</small></div></button>`).join(""):`<div class="empty">まだアルバムがありません<br>上のボタンから作ってみよう😊</div>`;
 $("#list").querySelectorAll(".alb").forEach(b=>{const a=ALBUMS[+b.dataset.i];b.onclick=()=>{cur=a;editor()};const cv=b.querySelector("canvas");if(a.pages[0]){const t=document.createElement("canvas");renderPage(t,a,a.pages[0],144).then(()=>{const c=cv.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,144,144);const k=Math.min(144/t.width,144/t.height);c.drawImage(t,(144-t.width*k)/2,(144-t.height*k)/2,t.width*k,t.height*k)})}})}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function newAlbum(){sheet(`<h2>＋ 新しいアルバム</h2>
 <div class="lab">アルバムの名前（自分用のメモ）</div><input id="an" placeholder="例：かいと 1さい / 田中さま 結婚式">
 <div class="lab">表紙のタイトル</div><input id="at" placeholder="例：かいと 1さいの思い出">
 <div class="lab">表紙のサブタイトル（日付など）</div><input id="as" placeholder="例：2026.4 - 2026.11">
 <div class="lab">サイズ</div><select id="az">${Object.entries(SIZES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join("")}</select>
 <button class="btn w" id="ok" style="margin-top:14px">作る → 写真を選ぶ</button>`);
 $("#ok").onclick=async()=>{const a={id:uid(),name:$("#an").value.trim()||"アルバム",title:$("#at").value.trim()||$("#an").value.trim()||"アルバム",sub:$("#as").value.trim(),size:$("#az").value,theme:"cream",photos:[],pages:[{cover:true,slots:[null]}],created:Date.now()};
  ALBUMS.unshift(a);await saveMeta();cur=a;closeSheet();editor();setTimeout(()=>$("#file").click(),250)}}
async function editor(){const a=cur;const sz=SIZES[a.size];
 $("#app").innerHTML=`<header><button class="ib" id="back">‹</button><h1>${esc(a.name)}</h1><button class="ib" id="exp" style="background:var(--p);color:#fff">📤 書き出す</button></header>
 <div class="tools"><button class="btn sub" id="add">📷 写真を追加</button><button class="btn sub" id="auto">✨ 自動で並べる</button><button class="btn sub" id="set">🎨 表紙・テーマ</button><button class="btn sub" id="addP">＋ ページ</button></div>
 <div class="sec">写真（${a.photos.length}枚）</div><div class="tray">${a.photos.map(p=>{const n=a.pages.reduce((s,g)=>s+g.slots.filter(x=>x===p.id).length,0);return`<div class="th" style="background-image:url(${p.th})">${n?`<i>✓${n>1?n:""}</i>`:""}</div>`}).join("")||`<span style="color:#9a8b7d;font-size:13px">「📷 写真を追加」から選んでください</span>`}</div>
 <div class="sec">ページ（${a.pages.length}）　ページを押すと変えられます</div>
 <div class="pages" id="pages" style="--ar:${sz.w}/${sz.h}">${a.pages.map((g,i)=>`<button class="pg${g.cover?" cover":""}" data-i="${i}"><canvas></canvas>${g.cover?"表紙":i+" ページ"}</button>`).join("")}</div>
 <div class="note">印刷するときは「📤 書き出す」からPDFか画像を保存して、<br>フォトブックの印刷サービスに入れてください。</div>`;
 $("#back").onclick=()=>home();$("#add").onclick=()=>$("#file").click();$("#auto").onclick=()=>{if(a.pages.length>1&&!confirm("今のページの並びを、自動の並びに置きかえますか？"))return;autoArrange()};
 $("#set").onclick=settings;$("#addP").onclick=()=>{a.pages.push({layout:"1",slots:[null],cap:""});saveMeta();editor();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),100)};$("#exp").onclick=exportSheet;
 const W=Math.min(600,innerWidth)*devicePixelRatio;
 for(const b of document.querySelectorAll("#pages .pg")){const i=+b.dataset.i;b.onclick=()=>pageEdit(i);await renderPage(b.querySelector("canvas"),a,a.pages[i],Math.round(a.pages[i].cover?W*.7:W/2))}}
function pageEdit(i){const a=cur,g=a.pages[i];
 const draw=()=>{const n=g.cover?1:LAYS[g.layout].length;while(g.slots.length<n)g.slots.push(null);g.slots.length=n;
  sheet(`<h2>${g.cover?"表紙":i+" ページ"}</h2>
  ${g.cover?"":`<div class="lab">レイアウト</div><div class="lays">${Object.keys(LAYS).map(k=>`<button data-l="${k}" class="${g.layout===k?"on":""}" title="${LAYNAME[k]}">${laySvg(k)}</button>`).join("")}</div>`}
  <div class="lab">写真（わくを押して写真を選ぶ）</div><div class="slots">${g.slots.map((id,j)=>`<button class="slot" data-s="${j}" style="${id?`background-image:url(${thumbURL(id)});border-style:solid`:""}"><b>${j+1}</b>${id?"":"＋"}</button>`).join("")}</div>
  ${g.cover?`<div class="lab">表紙のタイトル</div><input id="ct" value="${esc(a.title)}"><div class="lab">サブタイトル</div><input id="cs" value="${esc(a.sub)}">`:`<div class="lab">ひとこと（ページの下に入ります・ミャンマー語もOK）</div><textarea id="cap" rows="2" placeholder="例：はじめて歩いた日！">${esc(g.cap)}</textarea>`}
  <button class="btn w" id="ok" style="margin-top:14px">OK</button>
  ${g.cover?"":`<div class="row" style="margin-top:8px"><button class="btn sub" id="up" ${i<=1?"disabled":""}>⬆ 前へ</button><button class="btn sub" id="dn" ${i>=a.pages.length-1?"disabled":""}>⬇ 後ろへ</button></div><button class="btn red w" id="del" style="margin-top:8px">このページを消す</button>`}`);
  const sync=()=>{if(g.cover){a.title=$("#ct").value;a.sub=$("#cs").value}else g.cap=$("#cap").value};
  $("#sheet").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{sync();g.layout=b.dataset.l;draw()});
  $("#sheet").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sync();pickPhoto(id=>{g.slots[+b.dataset.s]=id;draw()})});
  $("#ok").onclick=()=>{sync();saveMeta();closeSheet();editor()};
  const up=$("#up"),dn=$("#dn"),dl=$("#del");
  if(up)up.onclick=()=>{sync();[a.pages[i-1],a.pages[i]]=[a.pages[i],a.pages[i-1]];saveMeta();closeSheet();editor()};
  if(dn)dn.onclick=()=>{sync();[a.pages[i+1],a.pages[i]]=[a.pages[i],a.pages[i+1]];saveMeta();closeSheet();editor()};
  if(dl)dl.onclick=()=>{if(confirm("このページを消しますか？（写真は消えません）")){a.pages.splice(i,1);saveMeta();closeSheet();editor()}}};
 draw()}
function pickPhoto(cb){const a=cur;const prev=$("#sheet").innerHTML;
 const used=id=>a.pages.reduce((s,g)=>s+g.slots.filter(x=>x===id).length,0);
 $("#sheet").innerHTML=`<h2>写真を選ぶ</h2><div class="pick">${a.photos.map(p=>`<button data-id="${p.id}" style="background-image:url(${p.th})">${used(p.id)?`<i>✓</i>`:""}</button>`).join("")}</div>
  <div class="row" style="margin-top:12px"><button class="btn sub" id="none">わくを空にする</button><button class="btn sub" id="more">📷 写真を追加</button></div>`;
 $("#sheet").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>cb(b.dataset.id));$("#none").onclick=()=>cb(null);$("#more").onclick=()=>{closeSheet();$("#file").click()}}
function settings(){const a=cur;
 sheet(`<h2>🎨 表紙・テーマ</h2>
 <div class="lab">アルバムの名前（自分用）</div><input id="an" value="${esc(a.name)}">
 <div class="lab">表紙のタイトル</div><input id="at" value="${esc(a.title)}">
 <div class="lab">サブタイトル</div><input id="as" value="${esc(a.sub)}">
 <div class="lab">テーマの色</div><div class="themes">${Object.entries(THEMES).map(([k,v])=>`<button data-t="${k}" class="${a.theme===k?"on":""}" style="background:linear-gradient(135deg,${v.bg} 50%,${v.acc} 50%)"></button>`).join("")}</div>
 <div class="lab">サイズ</div><select id="az">${Object.entries(SIZES).map(([k,v])=>`<option value="${k}" ${a.size===k?"selected":""}>${v.name}</option>`).join("")}</select>
 <button class="btn w" id="ok" style="margin-top:14px">保存</button>
 <button class="btn red w" id="delA" style="margin-top:10px">🗑 このアルバムを消す（写真も消えます）</button>`);
 let th=a.theme;$("#sheet").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{th=b.dataset.t;$("#sheet").querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b))});
 $("#ok").onclick=()=>{a.name=$("#an").value||a.name;a.title=$("#at").value;a.sub=$("#as").value;a.size=$("#az").value;a.theme=th;saveMeta();closeSheet();editor()};
 $("#delA").onclick=async()=>{if(!confirm(`「${a.name}」を消しますか？\n写真もこのスマホから消えます。元に戻せません。`))return;for(const p of a.photos){await delPhoto(p.id);delete IMG[p.id]}ALBUMS=ALBUMS.filter(x=>x!==a);await saveMeta();closeSheet();home();toast("消しました")}}
// ---------- export
function exportSheet(){sheet(`<h2>📤 書き出す</h2>
 <p style="font-size:13px;color:#7a6a5a;line-height:1.7;margin:0 0 6px">印刷サービスに入れる形で保存します。300dpi相当の高画質です。</p>
 <button class="btn w" id="pdf">📄 PDFで保存（1つのファイル）</button>
 <button class="btn sub w" id="jpg" style="margin-top:10px">🖼 ページごとの画像（JPEG）で保存</button>
 <div class="note">PDFが使えないときは、画像で保存してください。<br>多くのフォトブック印刷サービスは、どちらでも注文できます。</div>`);
 $("#pdf").onclick=()=>doExport("pdf");$("#jpg").onclick=()=>doExport("jpg")}
function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise((r,j)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=r;s.onerror=j;document.head.appendChild(s)})}
async function doExport(kind){const a=cur;closeSheet();const sz=SIZES[a.size];const W=Math.round(sz.mm[0]/25.4*300);
 try{await document.fonts.ready}catch(e){}
 const files=[];let pdf=null;
 if(kind==="pdf"){busy("準備中…");try{await loadJsPDF();pdf=new window.jspdf.jsPDF({unit:"mm",format:[sz.mm[0],sz.mm[1]],orientation:sz.mm[0]>sz.mm[1]?"l":"p"})}catch(e){busy(false);toast("PDFの準備ができませんでした<br>画像で保存してください");return}}
 for(let i=0;i<a.pages.length;i++){busy(`ページを作っています… ${i+1} / ${a.pages.length}`);const cv=document.createElement("canvas");await renderPage(cv,a,a.pages[i],W);
  if(pdf){if(i)pdf.addPage([sz.mm[0],sz.mm[1]],sz.mm[0]>sz.mm[1]?"l":"p");pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,sz.mm[0],sz.mm[1])}
  else{const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92));files.push(new File([b],`${a.name}_${String(i).padStart(2,"0")}.jpg`,{type:"image/jpeg"}))}
  cv.width=cv.height=1}
 busy(false);
 if(pdf){const b=pdf.output("blob");files.push(new File([b],`${a.name}.pdf`,{type:"application/pdf"}))}
 try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:a.name});return}}catch(e){if(e.name==="AbortError")return}
 for(const f of files){const u=URL.createObjectURL(f);const l=document.createElement("a");l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove()}
 toast("保存しました ✓")}
// ---------- sheet helpers
function sheet(h){$("#sheet").innerHTML=h;$("#bg").style.display="block";requestAnimationFrame(()=>$("#sheet").classList.add("on"))}
function closeSheet(){$("#sheet").classList.remove("on");setTimeout(()=>$("#bg").style.display="none",200)}
$("#bg").onclick=closeSheet;
// ---------- start
tx("meta","readonly",s=>s.get("albums")).then(v=>{ALBUMS=Array.isArray(v)?v:[];home()});
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{})</script>
